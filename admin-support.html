<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Admin Support — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=8">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #050806;
      color: #f5fff7;
      font-family: Arial, sans-serif;
      overscroll-behavior-x: none;
    }

    body.chat-open {
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* =========================
       ADMIN PAGE
    ========================= */

    .admin-page {
      min-height: 100dvh;
      width: 100%;
    }

    .admin-header {
      width: 100%;
      height: 68px;
      min-height: 68px;
      padding:
        0 16px
        env(safe-area-inset-right)
        0 env(safe-area-inset-left);

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #080d0a;
      border-bottom: 1px solid rgba(255,255,255,.07);

      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      color: #39e86f;
      font-weight: 900;
      font-size: 22px;
    }

    .admin-label {
      color: #89968e;
      font-size: 11px;
      margin-top: 3px;
    }

    .admin-container {
      width: min(1100px, calc(100% - 28px));
      margin: 24px auto;
      padding-bottom:
        calc(30px + env(safe-area-inset-bottom));
    }

    .eyebrow {
      color: #39e86f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    h1 {
      margin: 7px 0;
      font-size: 30px;
      line-height: 1.15;
    }

    .subtitle {
      color: #89958d;
      margin-bottom: 22px;
      font-size: 14px;
      line-height: 1.45;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      min-width: 0;
      background: #0c140f;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      padding: 15px;
    }

    .stat span {
      display: block;
      color: #748078;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 23px;
    }

    /* =========================
       TICKETS
    ========================= */

    .support-list {
      display: grid;
      gap: 10px;
    }

    .ticket {
      width: 100%;
      min-width: 0;
      padding: 15px;
      background: #0c140f;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease;
    }

    .ticket:active {
      transform: scale(.99);
    }

    .ticket:hover {
      border-color: rgba(57,232,111,.4);
    }

    .ticket-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .ticket-top > div:first-child {
      min-width: 0;
      flex: 1;
    }

    .ticket strong {
      display: block;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .email {
      color: #7f8d84;
      font-size: 11px;
      margin-top: 5px;
      overflow-wrap: anywhere;
    }

    .last-message {
      margin-top: 9px;
      color: #9aa59e;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .date {
      margin-top: 8px;
      color: #647068;
      font-size: 9px;
    }

    .status {
      flex-shrink: 0;
      height: fit-content;
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 8px;
      font-weight: 800;
    }

    .open {
      color: #39e86f;
      background: rgba(57,232,111,.1);
    }

    .pending {
      color: #ffbd4a;
      background: rgba(255,189,74,.1);
    }

    .resolved {
      color: #9ca69f;
      background: rgba(156,166,159,.1);
    }

    .empty {
      text-align: center;
      padding: 38px 18px;
      color: #718078;
      font-size: 13px;
    }

    /* =========================
       CHAT OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100dvh;

      background: rgba(0,0,0,.78);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 9999;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .overlay.show {
      display: flex;
    }

    /* =========================
       CHAT BOX
    ========================= */

    .chat {
      width: min(720px, calc(100% - 24px));
      height: min(760px, calc(100dvh - 24px));

      background: #080d0a;
      border: 1px solid rgba(57,232,111,.12);
      border-radius: 20px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      min-height: 0;
    }

    .chat-header {
      flex: 0 0 auto;

      min-height: 66px;
      padding: 12px;

      border-bottom: 1px solid rgba(255,255,255,.07);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .chat-header > div:first-child {
      min-width: 0;
      flex: 1;
    }

    .chat-header strong {
      display: block;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .chat-header small {
      display: block;
      color: #758078;
      font-size: 10px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .chat-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-actions button {
      border: 0;
      border-radius: 9px;
      padding: 8px 9px;
      cursor: pointer;
      background: #141d17;
      color: #fff;
      font-size: 10px;
      min-height: 34px;
    }

    .chat-actions .resolve {
      color: #031007;
      background: #39e86f;
      font-weight: 700;
    }

    .close {
      width: 36px;
      min-width: 36px;
      padding: 0 !important;
      background: #141d17 !important;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1 1 auto;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 14px;

      display: flex;
      flex-direction: column;
      gap: 9px;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;

      scrollbar-width: none;
    }

    .messages::-webkit-scrollbar {
      display: none;
    }

    .message {
      max-width: min(80%, 520px);

      padding: 10px 12px;

      border-radius: 15px;

      font-size: 13px;
      line-height: 1.45;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-start;
      background: #141d17;
    }

    .message.admin {
      align-self: flex-end;
      background: #39e86f;
      color: #031007;
    }

    .message small {
      display: block;
      opacity: .55;
      margin-top: 5px;
      font-size: 8px;
      line-height: 1.3;
    }

    /* =========================
       REPLY BAR
    ========================= */

    .reply {
      flex: 0 0 auto;

      width: 100%;

      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      display: flex;
      align-items: center;
      gap: 8px;

      border-top: 1px solid rgba(255,255,255,.07);

      background: #080d0a;
    }

    .reply input {
      flex: 1;
      min-width: 0;
      width: 100%;

      height: 44px;

      background: #050806;
      border: 1px solid rgba(255,255,255,.08);

      color: #fff;
      border-radius: 11px;

      padding: 0 12px;

      outline: none;

      font-size: 16px;
    }

    .reply input:focus {
      border-color: rgba(57,232,111,.45);
    }

    .reply button {
      width: 44px;
      min-width: 44px;
      height: 44px;

      border: 0;
      border-radius: 11px;

      background: #39e86f;
      color: #031007;

      cursor: pointer;
    }

    .reply button:disabled {
      opacity: .5;
    }

    /* =========================
       ACCESS DENIED
    ========================= */

    .access-denied {
      width: min(500px, calc(100% - 30px));
      margin: 80px auto;
      text-align: center;
      padding: 30px 20px;
      background: #0c140f;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.07);
    }

    .access-denied i {
      color: #ff5f56;
      font-size: 40px;
      margin-bottom: 15px;
    }

    .access-denied p {
      color: #89958d;
      line-height: 1.5;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .admin-header {
        height: 62px;
        min-height: 62px;
      }

      .logo {
        font-size: 20px;
      }

      .admin-label {
        font-size: 10px;
      }

      .admin-container {
        width: calc(100% - 22px);
        margin: 20px auto;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 13px;
        margin-bottom: 18px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .stat {
        padding: 12px 10px;
        border-radius: 13px;
      }

      .stat span {
        font-size: 8px;
      }

      .stat strong {
        font-size: 20px;
      }

      .ticket {
        padding: 13px;
        border-radius: 14px;
      }

      /*
        Full-screen mobile chat.
        This prevents the iPhone browser area from
        covering the header or reply box.
      */

      .overlay {
        align-items: stretch;
        justify-content: stretch;

        padding: 0;
      }

      .chat {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;

        border: 0;
        border-radius: 0;

        padding-top: env(safe-area-inset-top);
      }

      .chat-header {
        min-height: 62px;
        padding: 9px 10px;
      }

      .chat-actions {
        gap: 4px;
      }

      .chat-actions button {
        padding: 7px 8px;
        min-height: 32px;
        font-size: 9px;
      }

      .close {
        width: 34px;
        min-width: 34px;
      }

      .messages {
        padding: 12px 10px;
        gap: 8px;
      }

      .message {
        max-width: 86%;
        font-size: 13px;
        padding: 9px 11px;
      }

      .reply {
        padding:
          8px
          10px
          calc(8px + env(safe-area-inset-bottom))
          10px;
      }

      .reply input {
        height: 44px;
      }

      .reply button {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 390px) {

      .admin-container {
        width: calc(100% - 18px);
      }

      .stats {
        gap: 5px;
      }

      .stat {
        padding: 11px 8px;
      }

      .stat strong {
        font-size: 18px;
      }

      .chat-actions button {
        padding: 7px 6px;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body class="admin-page">

<header class="admin-header">

  <div>
    <div class="logo">Wavynum</div>
    <div class="admin-label">Support Administration</div>
  </div>

</header>


<main class="admin-container" id="adminContent">

  <div class="eyebrow">ADMIN SUPPORT</div>

  <h1>Customer conversations</h1>

  <div class="subtitle">
    Manage support requests from Wavynum users.
  </div>


  <section class="stats">

    <div class="stat">
      <span>TOTAL</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <span>OPEN</span>
      <strong id="openCount">0</strong>
    </div>

    <div class="stat">
      <span>RESOLVED</span>
      <strong id="resolvedCount">0</strong>
    </div>

  </section>


  <section id="ticketList" class="support-list">

    <div class="empty">
      Loading support requests...
    </div>

  </section>

</main>


<!-- ADMIN CHAT -->

<div id="overlay" class="overlay">

  <div class="chat">

    <div class="chat-header">

      <div>
        <strong id="chatTitle">Support</strong>
        <small id="chatEmail"></small>
      </div>

      <div class="chat-actions">

        <button id="pendingButton">
          Pending
        </button>

        <button id="resolveButton" class="resolve">
          Resolve
        </button>

        <button id="closeButton" class="close">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

    </div>


    <div id="messages" class="messages"></div>


    <form id="replyForm" class="reply">

      <input
        id="replyInput"
        type="text"
        maxlength="2000"
        placeholder="Reply to customer..."
        autocomplete="off"
        required
      >

      <button type="submit" aria-label="Send reply">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </form>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID = "9msvItX8pAYdz4OLdm1QHGtXFQ33";


/* =========================
   ELEMENTS
========================= */

const adminContent =
  document.getElementById("adminContent");

const ticketList =
  document.getElementById("ticketList");

const totalCount =
  document.getElementById("totalCount");

const openCount =
  document.getElementById("openCount");

const resolvedCount =
  document.getElementById("resolvedCount");

const overlay =
  document.getElementById("overlay");

const chatTitle =
  document.getElementById("chatTitle");

const chatEmail =
  document.getElementById("chatEmail");

const messages =
  document.getElementById("messages");

const replyForm =
  document.getElementById("replyForm");

const replyInput =
  document.getElementById("replyInput");

const pendingButton =
  document.getElementById("pendingButton");

const resolveButton =
  document.getElementById("resolveButton");

const closeButton =
  document.getElementById("closeButton");


let adminUser = null;
let currentTicketId = null;
let unsubscribeMessages = null;


/* =========================
   ADMIN AUTHORIZATION
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    showAccessDenied(
      "Please sign in to access the admin support center."
    );

    return;
  }

  if (user.uid !== ADMIN_UID) {

    showAccessDenied(
      "This account is not authorized to access the admin support center."
    );

    return;
  }

  adminUser = user;

  await loadTickets();

});


function showAccessDenied(message) {

  adminContent.innerHTML = `
    <div class="access-denied">

      <i class="fa-solid fa-lock"></i>

      <h2>Access restricted</h2>

      <p>${message}</p>

      <a
        href="dashboard.html"
        style="color:#39e86f;text-decoration:none;"
      >
        Return to dashboard
      </a>

    </div>
  `;

}


/* =========================
   LOAD SUPPORT REQUESTS
========================= */

async function loadTickets() {

  try {

    const ticketsQuery = query(
      collection(db, "supportTickets"),
      orderBy("updatedAt", "desc")
    );

    const snapshot =
      await getDocs(ticketsQuery);

    const tickets = [];

    snapshot.forEach(item => {

      tickets.push({
        id: item.id,
        ...item.data()
      });

    });


    totalCount.textContent =
      tickets.length;

    openCount.textContent =
      tickets.filter(
        t => t.status === "open"
      ).length;

    resolvedCount.textContent =
      tickets.filter(
        t => t.status === "resolved"
      ).length;


    if (!tickets.length) {

      ticketList.innerHTML = `
        <div class="empty">
          No support requests yet.
        </div>
      `;

      return;
    }


    ticketList.innerHTML = "";


    tickets.forEach(ticket => {

      const status =
        ticket.status || "open";

      const item =
        document.createElement("div");

      item.className = "ticket";

      item.innerHTML = `

        <div class="ticket-top">

          <div>

            <strong>
              ${escapeHtml(
                ticket.subject ||
                "Support request"
              )}
            </strong>

            <div class="email">
              ${escapeHtml(
                ticket.userEmail ||
                "Unknown user"
              )}
            </div>

          </div>

          <span class="status ${status}">
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="last-message">
          ${escapeHtml(
            ticket.lastMessage || ""
          )}
        </div>

        <div class="date">
          ${formatDate(
            ticket.updatedAt
          )}
        </div>

      `;


      item.addEventListener(
        "click",
        () => openTicket(ticket.id)
      );


      ticketList.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    ticketList.innerHTML = `
      <div class="empty">
        Could not load support requests.
      </div>
    `;

  }

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openTicket(ticketId) {

  const ticketSnap =
    await getDoc(
      doc(
        db,
        "supportTickets",
        ticketId
      )
    );


  if (!ticketSnap.exists()) {
    return;
  }


  const ticket =
    ticketSnap.data();


  currentTicketId =
    ticketId;


  chatTitle.textContent =
    ticket.subject ||
    "Support request";


  chatEmail.textContent =
    ticket.userEmail || "";


  overlay.classList.add("show");

  document.body.classList.add("chat-open");


  if (unsubscribeMessages) {

    unsubscribeMessages();

  }


  const messagesQuery =
    query(
      collection(
        db,
        "supportTickets",
        ticketId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      snapshot => {

        messages.innerHTML = "";


        snapshot.forEach(item => {

          const data =
            item.data();


          const bubble =
            document.createElement("div");


          bubble.className =
            "message " +
            (
              data.senderRole === "admin"
                ? "admin"
                : "user"
            );


          bubble.innerHTML = `

            ${escapeHtml(
              data.message || ""
            )}

            <small>

              ${
                data.senderRole === "admin"
                  ? "Admin"
                  : "Customer"
              }

              ·

              ${formatDate(
                data.createdAt
              )}

            </small>

          `;


          messages.appendChild(
            bubble
          );

        });


        requestAnimationFrame(() => {

          messages.scrollTop =
            messages.scrollHeight;

        });

      }
    );


  setTimeout(() => {

    replyInput.focus();

  }, 250);

}


/* =========================
   ADMIN REPLY
========================= */

replyForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (
      !currentTicketId ||
      !adminUser
    ) {
      return;
    }


    const text =
      replyInput.value.trim();


    if (!text) {
      return;
    }


    replyInput.disabled = true;


    try {

      await addDoc(
        collection(
          db,
          "supportTickets",
          currentTicketId,
          "messages"
        ),
        {
          senderId:
            adminUser.uid,

          senderRole:
            "admin",

          message:
            text,

          createdAt:
            serverTimestamp()
        }
      );


      await updateDoc(
        doc(
          db,
          "supportTickets",
          currentTicketId
        ),
        {
          lastMessage:
            text,

          status:
            "open",

          updatedAt:
            serverTimestamp()
        }
      );


      replyInput.value = "";


    } catch (error) {

      console.error(error);

      alert(
        "Could not send reply."
      );


    } finally {

      replyInput.disabled =
        false;

      setTimeout(() => {
        replyInput.focus();
      }, 100);

    }

  }
);


/* =========================
   CHANGE STATUS
========================= */

pendingButton.addEventListener(
  "click",
  () => {
    changeStatus("pending");
  }
);


resolveButton.addEventListener(
  "click",
  () => {
    changeStatus("resolved");
  }
);


async function changeStatus(status) {

  if (!currentTicketId) {
    return;
  }


  try {

    await updateDoc(
      doc(
        db,
        "supportTickets",
        currentTicketId
      ),
      {
        status:
          status,

        updatedAt:
          serverTimestamp()
      }
    );


    await loadTickets();


  } catch (error) {

    console.error(error);

    alert(
      "Could not update ticket status."
    );

  }

}


/* =========================
   CLOSE CHAT
========================= */

closeButton.addEventListener(
  "click",
  closeChat
);


overlay.addEventListener(
  "click",
  event => {

    if (event.target === overlay) {
      closeChat();
    }

  }
);


function closeChat() {

  overlay.classList.remove("show");

  document.body.classList.remove(
    "chat-open"
  );


  if (unsubscribeMessages) {

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  currentTicketId =
    null;

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function formatDate(timestamp) {

  if (!timestamp?.toDate) {

    return "Just now";

  }


  return timestamp
    .toDate()
    .toLocaleString();

}

</script>

</body>
</html>
