<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Support — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      margin: 0;
      background: #050806;
      color: #f5fff7;
      font-family: Arial, sans-serif;
    }

    .admin-page {
      min-height: 100vh;
    }

    .admin-header {
      height: 72px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #080d0a;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .logo {
      color: #39e86f;
      font-weight: 900;
      font-size: 23px;
    }

    .admin-label {
      color: #89968e;
      font-size: 12px;
      margin-top: 3px;
    }

    .admin-container {
      width: min(1100px, calc(100% - 28px));
      margin: 28px auto;
    }

    .eyebrow {
      color: #39e86f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    h1 {
      margin: 7px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #89958d;
      margin-bottom: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #0c140f;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      padding: 16px;
    }

    .stat span {
      display: block;
      color: #748078;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 24px;
    }

    .support-list {
      display: grid;
      gap: 10px;
    }

    .ticket {
      padding: 17px;
      background: #0c140f;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      cursor: pointer;
    }

    .ticket:hover {
      border-color: rgba(57,232,111,.4);
    }

    .ticket-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .email {
      color: #7f8d84;
      font-size: 12px;
      margin-top: 6px;
    }

    .last-message {
      margin-top: 10px;
      color: #9aa59e;
      font-size: 13px;
    }

    .date {
      margin-top: 9px;
      color: #647068;
      font-size: 10px;
    }

    .status {
      height: fit-content;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
    }

    .open {
      color: #39e86f;
      background: rgba(57,232,111,.1);
    }

    .pending {
      color: #ffbd4a;
      background: rgba(255,189,74,.1);
    }

    .resolved {
      color: #9ca69f;
      background: rgba(156,166,159,.1);
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #718078;
    }

    /* CHAT */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .overlay.show {
      display: flex;
    }

    .chat {
      width: min(720px, 95%);
      height: min(760px, 94vh);
      background: #080d0a;
      border: 1px solid rgba(57,232,111,.12);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-header strong {
      display: block;
    }

    .chat-header small {
      color: #758078;
    }

    .chat-actions {
      display: flex;
      gap: 7px;
    }

    .chat-actions button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      background: #141d17;
      color: #fff;
      font-size: 11px;
    }

    .chat-actions .resolve {
      color: #031007;
      background: #39e86f;
    }

    .close {
      width: 38px;
      background: #141d17 !important;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 11px 13px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.user {
      align-self: flex-start;
      background: #141d17;
    }

    .message.admin {
      align-self: flex-end;
      background: #39e86f;
      color: #031007;
    }

    .message small {
      display: block;
      opacity: .55;
      margin-top: 5px;
      font-size: 9px;
    }

    .reply {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .reply input {
      flex: 1;
      min-width: 0;
      background: #050806;
      border: 1px solid rgba(255,255,255,.08);
      color: #fff;
      border-radius: 11px;
      padding: 13px;
      outline: none;
    }

    .reply button {
      width: 48px;
      border: 0;
      border-radius: 11px;
      background: #39e86f;
      color: #031007;
    }

    .access-denied {
      width: min(500px, calc(100% - 30px));
      margin: 100px auto;
      text-align: center;
      padding: 30px;
      background: #0c140f;
      border-radius: 20px;
    }

    .access-denied i {
      color: #ff5f56;
      font-size: 40px;
      margin-bottom: 15px;
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }

      .chat {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      .chat-actions button {
        padding: 7px;
      }
    }
  </style>
</head>

<body class="admin-page">

<header class="admin-header">

  <div>
    <div class="logo">Wavynum</div>
    <div class="admin-label">Support Administration</div>
  </div>

</header>

<main class="admin-container" id="adminContent">

  <div class="eyebrow">ADMIN SUPPORT</div>

  <h1>Customer conversations</h1>

  <div class="subtitle">
    Manage support requests from Wavynum users.
  </div>

  <section class="stats">

    <div class="stat">
      <span>TOTAL</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <span>OPEN</span>
      <strong id="openCount">0</strong>
    </div>

    <div class="stat">
      <span>RESOLVED</span>
      <strong id="resolvedCount">0</strong>
    </div>

  </section>

  <section id="ticketList" class="support-list">
    <div class="empty">
      Loading support requests...
    </div>
  </section>

</main>

<!-- ADMIN CHAT -->

<div id="overlay" class="overlay">

  <div class="chat">

    <div class="chat-header">

      <div>
        <strong id="chatTitle">Support</strong>
        <small id="chatEmail"></small>
      </div>

      <div class="chat-actions">

        <button id="pendingButton">
          Pending
        </button>

        <button id="resolveButton" class="resolve">
          Resolve
        </button>

        <button id="closeButton" class="close">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

    </div>

    <div id="messages" class="messages"></div>

    <form id="replyForm" class="reply">

      <input
        id="replyInput"
        type="text"
        maxlength="2000"
        placeholder="Reply to customer..."
        required
      >

      <button type="submit">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </form>

  </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* YOUR ADMIN UID */

const ADMIN_UID = "9msvItX8pAYdz4OLdm1QHGtXFQ33";


const adminContent = document.getElementById("adminContent");
const ticketList = document.getElementById("ticketList");

const totalCount = document.getElementById("totalCount");
const openCount = document.getElementById("openCount");
const resolvedCount = document.getElementById("resolvedCount");

const overlay = document.getElementById("overlay");
const chatTitle = document.getElementById("chatTitle");
const chatEmail = document.getElementById("chatEmail");
const messages = document.getElementById("messages");

const replyForm = document.getElementById("replyForm");
const replyInput = document.getElementById("replyInput");

const pendingButton = document.getElementById("pendingButton");
const resolveButton = document.getElementById("resolveButton");
const closeButton = document.getElementById("closeButton");

let adminUser = null;
let currentTicketId = null;
let unsubscribeMessages = null;


/* ADMIN AUTHORIZATION */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    showAccessDenied(
      "Please sign in to access the admin support center."
    );

    return;
  }

  if (user.uid !== ADMIN_UID) {

    showAccessDenied(
      "This account is not authorized to access the admin support center."
    );

    return;
  }

  adminUser = user;

  await loadTickets();

});


function showAccessDenied(message) {

  adminContent.innerHTML = `
    <div class="access-denied">

      <i class="fa-solid fa-lock"></i>

      <h2>Access restricted</h2>

      <p>${message}</p>

      <a href="dashboard.html"
         style="color:#39e86f;text-decoration:none;">
        Return to dashboard
      </a>

    </div>
  `;

}


/* LOAD SUPPORT REQUESTS */

async function loadTickets() {

  try {

    const ticketsQuery = query(
      collection(db, "supportTickets"),
      orderBy("updatedAt", "desc")
    );

    const snapshot = await getDocs(ticketsQuery);

    const tickets = [];

    snapshot.forEach(item => {

      tickets.push({
        id: item.id,
        ...item.data()
      });

    });

    totalCount.textContent = tickets.length;

    openCount.textContent =
      tickets.filter(t => t.status === "open").length;

    resolvedCount.textContent =
      tickets.filter(t => t.status === "resolved").length;

    if (!tickets.length) {

      ticketList.innerHTML = `
        <div class="empty">
          No support requests yet.
        </div>
      `;

      return;
    }

    ticketList.innerHTML = "";

    tickets.forEach(ticket => {

      const status = ticket.status || "open";

      const item = document.createElement("div");

      item.className = "ticket";

      item.innerHTML = `

        <div class="ticket-top">

          <div>

            <strong>
              ${escapeHtml(ticket.subject || "Support request")}
            </strong>

            <div class="email">
              ${escapeHtml(ticket.userEmail || "Unknown user")}
            </div>

          </div>

          <span class="status ${status}">
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="last-message">
          ${escapeHtml(ticket.lastMessage || "")}
        </div>

        <div class="date">
          ${formatDate(ticket.updatedAt)}
        </div>

      `;

      item.addEventListener("click", () => {
        openTicket(ticket.id);
      });

      ticketList.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    ticketList.innerHTML = `
      <div class="empty">
        Could not load support requests.
      </div>
    `;

  }

}


/* OPEN CONVERSATION */

async function openTicket(ticketId) {

  const ticketSnap = await getDoc(
    doc(db, "supportTickets", ticketId)
  );

  if (!ticketSnap.exists()) return;

  const ticket = ticketSnap.data();

  currentTicketId = ticketId;

  chatTitle.textContent =
    ticket.subject || "Support request";

  chatEmail.textContent =
    ticket.userEmail || "";

  overlay.classList.add("show");

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  const messagesQuery = query(
    collection(
      db,
      "supportTickets",
      ticketId,
      "messages"
    ),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(
    messagesQuery,
    snapshot => {

      messages.innerHTML = "";

      snapshot.forEach(item => {

        const data = item.data();

        const bubble =
          document.createElement("div");

        bubble.className =
          "message " +
          (data.senderRole === "admin"
            ? "admin"
            : "user");

        bubble.innerHTML = `
          ${escapeHtml(data.message || "")}

          <small>
            ${data.senderRole === "admin"
              ? "Admin"
              : "Customer"}
            · ${formatDate(data.createdAt)}
          </small>
        `;

        messages.appendChild(bubble);

      });

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* ADMIN REPLY */

replyForm.addEventListener("submit", async event => {

  event.preventDefault();

  if (!currentTicketId || !adminUser) return;

  const text = replyInput.value.trim();

  if (!text) return;

  replyInput.disabled = true;

  try {

    await addDoc(
      collection(
        db,
        "supportTickets",
        currentTicketId,
        "messages"
      ),
      {
        senderId: adminUser.uid,
        senderRole: "admin",
        message: text,
        createdAt: serverTimestamp()
      }
    );

    await updateDoc(
      doc(db, "supportTickets", currentTicketId),
      {
        lastMessage: text,
        status: "open",
        updatedAt: serverTimestamp()
      }
    );

    replyInput.value = "";

  } catch (error) {

    console.error(error);

    alert("Could not send reply.");

  } finally {

    replyInput.disabled = false;
    replyInput.focus();

  }

});


/* CHANGE STATUS */

pendingButton.addEventListener("click", () => {
  changeStatus("pending");
});

resolveButton.addEventListener("click", () => {
  changeStatus("resolved");
});


async function changeStatus(status) {

  if (!currentTicketId) return;

  try {

    await updateDoc(
      doc(db, "supportTickets", currentTicketId),
      {
        status: status,
        updatedAt: serverTimestamp()
      }
    );

    await loadTickets();

  } catch (error) {

    console.error(error);

    alert("Could not update ticket status.");

  }

}


/* CLOSE CHAT */

closeButton.addEventListener("click", () => {

  overlay.classList.remove("show");

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  currentTicketId = null;

});


/* HELPERS */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatDate(timestamp) {

  if (!timestamp?.toDate) {
    return "Just now";
  }

  return timestamp.toDate().toLocaleString();

}

</script>

</body>
</html>
