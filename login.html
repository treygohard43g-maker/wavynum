<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In — Wavynum</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #0b110d;
            border: 1px solid rgba(34,197,94,.15);
            border-radius: 22px;
            padding: 34px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .auth-logo {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            color: #39e86f;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-card h1 {
            color: #ecfdf3;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .auth-card > p {
            color: #7e8a82;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #b8c4bc;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(34,197,94,.15);
            background: #070b08;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #22c55e;
        }

        .auth-button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: #22c55e;
            color: #031108;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #718078;
            font-size: 14px;
        }

        .auth-footer a {
            color: #39e86f;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                Wavynum
            </a>

            <h1>Welcome back</h1>

            <p>Log in to your Wavynum account.</p>

            <form>

                <div class="form-group">
                    <label>Email address</label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Log in
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </div>

        </div>

    </div>

</body>
</html>
