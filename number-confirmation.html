<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirm Purchase — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=7">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    /* ================================
       WAVYNUM CONFIRMATION PAGE
       ================================ */

    .confirmation-main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .confirmation-header {
      margin-bottom: 22px;
    }

    .confirmation-header h1 {
      margin: 4px 0 8px;
    }

    .confirmation-header .dashboard-subtitle {
      margin: 0;
    }

    .purchase-card {
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.18);
      backdrop-filter: blur(12px);
    }

    .service-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .service-icon {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 20px;
    }

    .service-info h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    .service-info p {
      margin: 0;
      opacity: .65;
      font-size: 13px;
    }

    .selected-number {
      text-align: center;
      padding: 28px 10px;
    }

    .selected-number-label {
      display: block;
      font-size: 12px;
      opacity: .55;
      margin-bottom: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .selected-number strong {
      font-size: clamp(23px, 7vw, 31px);
      letter-spacing: .3px;
    }

    .details-box {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 12px 2px;
      font-size: 14px;
    }

    .detail-row span {
      opacity: .58;
    }

    .detail-row strong {
      text-align: right;
    }

    .wallet-card {
      margin-top: 14px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .wallet-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .wallet-label {
      font-size: 12px;
      opacity: .58;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .wallet-amount {
      font-size: 22px;
      font-weight: 800;
      margin-top: 5px;
    }

    .wallet-icon-small {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
    }

    .buy-button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    .buy-button:active {
      transform: scale(.98);
    }

    .buy-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .back-link {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 17px;
      color: inherit;
      opacity: .62;
      text-decoration: none;
      font-size: 13px;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(220,38,38,.13);
      border: 1px solid rgba(220,38,38,.2);
      color: #ff9b9b;
    }

    .message.success {
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.2);
      color: #8ff0ad;
    }

    .loading {
      text-align: center;
      padding: 45px 15px;
      opacity: .6;
    }

    .loading i {
      font-size: 24px;
      margin-bottom: 10px;
    }

    @media (max-width: 430px) {

      .confirmation-main {
        padding: 22px 14px 45px;
      }

      .purchase-card {
        padding: 15px;
        border-radius: 21px;
      }

      .selected-number {
        padding: 24px 6px;
      }

      .detail-row {
        font-size: 13px;
      }

      .wallet-amount {
        font-size: 20px;
      }

    }
  </style>
</head>

<body class="dashboard-page">

  <!-- HEADER -->
  <header class="dashboard-header">

    <a href="buy-number.html" class="dashboard-logo">
      Wavynum
    </a>

    <a
      href="number-selection.html"
      class="back-button"
      aria-label="Back"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </a>

  </header>


  <!-- MAIN -->
  <main class="confirmation-main">

    <section class="confirmation-header">

      <p class="dashboard-eyebrow">
        PURCHASE
      </p>

      <h1>
        Confirm your number
      </h1>

      <p class="dashboard-subtitle">
        Review the details before completing your purchase.
      </p>

    </section>


    <!-- LOADING -->
    <div id="loadingState" class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <div>
        Loading purchase details...
      </div>

    </div>


    <!-- PURCHASE CONTENT -->
    <section
      id="confirmationContent"
      class="purchase-card"
      style="display:none;"
    >

      <!-- SERVICE -->
      <div class="service-row">

        <div class="service-icon">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <div class="service-info">

          <h2 id="serviceName">
            Service
          </h2>

          <p id="countryName">
            Country
          </p>

        </div>

      </div>


      <!-- NUMBER -->
      <div class="selected-number">

        <span class="selected-number-label">
          Selected number
        </span>

        <strong id="phoneNumber">
          —
        </strong>

      </div>


      <!-- DETAILS -->
      <div class="details-box">

        <div class="detail-row">

          <span>
            Service
          </span>

          <strong id="serviceDetail">
            —
          </strong>

        </div>


        <div class="detail-row">

          <span>
            Country
          </span>

          <strong id="countryDetail">
            —
          </strong>

        </div>


        <div class="detail-row">

          <span>
            Purchase price
          </span>

          <strong id="priceDetail">
            $0.00
          </strong>

        </div>

      </div>


      <!-- WALLET -->
      <div class="wallet-card">

        <div class="wallet-card-top">

          <div>

            <div class="wallet-label">
              USD Wallet Balance
            </div>

            <div
              class="wallet-amount"
              id="walletBalance"
            >
              $0.00
            </div>

          </div>

          <div class="wallet-icon-small">

            <i class="fa-solid fa-dollar-sign"></i>

          </div>

        </div>

      </div>


      <!-- BUY -->
      <button
        type="button"
        id="buyButton"
        class="buy-button"
      >
        Buy Number
      </button>


      <!-- MESSAGE -->
      <div
        id="message"
        class="message"
      ></div>


      <!-- BACK -->
      <a
        href="number-selection.html"
        class="back-link"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Choose another number
      </a>

    </section>

  </main>


  <!-- FIREBASE / PURCHASE LOGIC -->
  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      runTransaction,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const selectedRaw =
      localStorage.getItem("wavynumSelectedNumber");


    const loadingState =
      document.getElementById("loadingState");

    const confirmationContent =
      document.getElementById("confirmationContent");

    const serviceName =
      document.getElementById("serviceName");

    const countryName =
      document.getElementById("countryName");

    const phoneNumber =
      document.getElementById("phoneNumber");

    const serviceDetail =
      document.getElementById("serviceDetail");

    const countryDetail =
      document.getElementById("countryDetail");

    const priceDetail =
      document.getElementById("priceDetail");

    const walletBalance =
      document.getElementById("walletBalance");

    const buyButton =
      document.getElementById("buyButton");

    const message =
      document.getElementById("message");


    if (!selectedRaw) {

      loadingState.innerHTML = `
        <p>No number has been selected.</p>
        <a href="buy-number.html">Return to Buy Number</a>
      `;

      throw new Error("No selected number");

    }


    const selectedNumber =
      JSON.parse(selectedRaw);


    const price =
      Number(selectedNumber.price || 0);


    serviceName.textContent =
      selectedNumber.service || "Service";

    countryName.textContent =
      selectedNumber.countryName ||
      selectedNumber.country ||
      "Country";

    phoneNumber.textContent =
      selectedNumber.number || "—";

    serviceDetail.textContent =
      selectedNumber.service || "—";

    countryDetail.textContent =
      selectedNumber.countryName ||
      selectedNumber.country ||
      "—";

    priceDetail.textContent =
      "$" + price.toFixed(2);


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.className =
        "message";

      message.textContent = "";

    }


    function showWalletBalance(balance) {

      walletBalance.textContent =
        "$" + Number(balance).toFixed(2);

    }


    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      try {

        const userRef =
          doc(db, "users", user.uid);


        const userSnapshot =
          await getDoc(userRef);


        if (!userSnapshot.exists()) {

          loadingState.textContent =
            "Your wallet account could not be found.";

          return;

        }


        const userData =
          userSnapshot.data();


        /*
          IMPORTANT:
          Wavynum uses usdBalance.
        */

        const usd =
          Number(
            userData.usdBalance || 0
          );


        showWalletBalance(usd);


        loadingState.style.display =
          "none";

        confirmationContent.style.display =
          "block";


        buyButton.addEventListener(
          "click",
          () => purchaseNumber(user)
        );


      } catch (error) {

        console.error(
          "Wallet loading error:",
          error
        );

        loadingState.textContent =
          "Unable to load your wallet balance.";

      }

    });


    async function purchaseNumber(user) {

      hideMessage();

      buyButton.disabled = true;

      buyButton.textContent =
        "Processing...";


      try {

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const numberId =
          selectedNumber.number
            .replace(/\D/g, "");


        const numberRef =
          doc(
            db,
            "numbers",
            numberId
          );


        const ownedNumberRef =
          doc(
            db,
            "users",
            user.uid,
            "numbers",
            numberId
          );


        const purchaseRef =
          doc(
            collection(
              db,
              "purchases"
            )
          );


        const transactionRef =
          doc(
            collection(
              db,
              "transactions"
            )
          );


        const otp =
          Math.floor(
            100000 +
            Math.random() * 900000
          ).toString();


        await runTransaction(
          db,
          async (transaction) => {

            const userSnapshot =
              await transaction.get(
                userRef
              );


            if (!userSnapshot.exists()) {

              throw new Error(
                "Wallet account not found."
              );

            }


            const userData =
              userSnapshot.data();


            const currentBalance =
              Number(
                userData.usdBalance || 0
              );


            if (currentBalance < price) {

              throw new Error(
                "Your USD wallet balance is too low for this purchase."
              );

            }


            const numberSnapshot =
              await transaction.get(
                numberRef
              );


            if (numberSnapshot.exists()) {

              throw new Error(
                "This number has already been purchased."
              );

            }


            const newBalance =
              currentBalance - price;


            transaction.update(
              userRef,
              {
                usdBalance:
                  newBalance
              }
            );


            transaction.set(
              numberRef,
              {
                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "sold",

                ownerId:
                  user.uid,

                soldAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              ownedNumberRef,
              {
                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "active",

                demoOtp:
                  otp,

                purchasedAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              purchaseRef,
              {
                userId:
                  user.uid,

                numberId:
                  numberId,

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                price:
                  price,

                status:
                  "completed",

                purchasedAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              transactionRef,
              {
                userId:
                  user.uid,

                type:
                  "number_purchase",

                amount:
                  -price,

                currency:
                  "USD",

                description:
                  "Purchased " +
                  selectedNumber.service +
                  " number",

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                createdAt:
                  serverTimestamp()
              }
            );

          }
        );


        localStorage.removeItem(
          "wavynumSelectedNumber"
        );


        showMessage(
          "Number purchased successfully.",
          "success"
        );


        buyButton.textContent =
          "Purchase Complete";


        setTimeout(() => {

          window.location.href =
            "my-numbers.html";

        }, 900);


      } catch (error) {

        console.error(
          "Purchase error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to complete purchase.",
          "error"
        );


        buyButton.disabled =
          false;

        buyButton.textContent =
          "Buy Number";

      }

    }

  </script>

</body>
</html>
