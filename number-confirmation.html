<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirm Number - Wavynum</title>

  <link
    rel="stylesheet"
    href="style.css?v=12"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    /*
      Wavynum confirmation page
      Green + black design
    */

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(0, 255, 140, 0.08),
          transparent 35%
        ),
        #020604;
      color: #ffffff;
    }

    .confirmation-main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px 40px;
    }

    .confirmation-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .confirmation-back {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      color: #ffffff;
      text-decoration: none;
      background: #08130e;
      border: 1px solid rgba(0, 255, 140, 0.22);
    }

    .confirmation-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .confirmation-header p {
      margin: 4px 0 0;
      color: rgba(255,255,255,0.58);
      font-size: 13px;
    }

    .confirmation-card {
      width: 100%;
      background: #08130e;
      border: 1px solid rgba(0, 255, 140, 0.20);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.28);
    }

    .confirmation-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      border-bottom: 1px solid rgba(0,255,140,0.10);
    }

    .number-label {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 7px;
    }

    .actual-phone-number {
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .3px;
      word-break: break-word;
    }

    .number-price {
      text-align: right;
      flex-shrink: 0;
    }

    .number-price-value {
      color: #35e58a;
      font-size: 21px;
      font-weight: 800;
    }

    .number-price-label {
      color: rgba(255,255,255,0.50);
      font-size: 11px;
      margin-top: 2px;
    }

    .number-details {
      padding: 5px 20px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: rgba(255,255,255,0.58);
      font-size: 13px;
    }

    .detail-label i {
      width: 20px;
      color: #35e58a;
      margin-right: 4px;
    }

    .detail-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-align: right;
    }

    .available {
      color: #35e58a;
    }

    .confirmation-action {
      padding: 15px 20px 20px;
    }

    .buy-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      background: #19b968;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .buy-button:hover {
      background: #21d477;
      transform: translateY(-1px);
    }

    .buy-button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      background: #08130e;
      border: 1px solid rgba(0,255,140,0.18);
      border-radius: 15px;
      padding: 16px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      margin-bottom: 15px;
    }

    .notice i {
      color: #35e58a;
      margin-right: 7px;
    }

    .error-notice {
      display: none;
      border-color: rgba(255,80,80,0.25);
    }

    .error-notice i {
      color: #ff6666;
    }

    .success-card {
      display: none;
      text-align: center;
      padding: 30px 20px;
    }

    .success-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(25,185,104,0.12);
      border: 1px solid rgba(25,185,104,0.30);
      color: #35e58a;
      font-size: 25px;
    }

    .success-card h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .success-card p {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.58);
      font-size: 13px;
    }

    .success-number {
      color: #35e58a;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .numbers-link {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 13px;
      background: #19b968;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 600px) {

      .confirmation-main {
        padding: 18px 13px 30px;
      }

      .confirmation-top {
        padding: 17px;
      }

      .number-details {
        padding: 5px 17px;
      }

      .confirmation-action {
        padding: 14px 17px 17px;
      }

      .actual-phone-number {
        font-size: 18px;
      }

      .number-price-value {
        font-size: 18px;
      }

    }
  </style>
</head>

<body>

  <main class="confirmation-main">

    <div class="confirmation-header">

      <a
        href="number-selection.html"
        class="confirmation-back"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <div>
        <h1>Confirm Number</h1>
        <p>Review your selected number</p>
      </div>

    </div>


    <!-- LOADING -->

    <div
      id="loadingBox"
      class="notice"
    >
      <i class="fa-solid fa-spinner fa-spin"></i>
      Loading number...
    </div>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="notice error-notice"
    >
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorText">
        Unable to load this number.
      </span>
    </div>


    <!-- CONFIRMATION -->

    <section
      id="confirmationCard"
      class="confirmation-card"
      style="display:none;"
    >

      <div class="confirmation-top">

        <div>

          <div class="number-label">
            Actual phone number
          </div>

          <div
            id="actualNumber"
            class="actual-phone-number"
          >
            Loading...
          </div>

        </div>


        <div class="number-price">

          <div
            id="numberPrice"
            class="number-price-value"
          >
            $0.00
          </div>

          <div class="number-price-label">
            USD
          </div>

        </div>

      </div>


      <div class="number-details">

        <div class="detail-row">

          <div class="detail-label">
            <i class="fa-solid fa-globe"></i>
            Country
          </div>

          <div
            id="countryName"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            <i class="fa-solid fa-server"></i>
            Provider
          </div>

          <div
            id="provider"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            <i class="fa-solid fa-mobile-screen-button"></i>
            Service
          </div>

          <div
            id="serviceName"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            <i class="fa-solid fa-circle-check"></i>
            Status
          </div>

          <div class="detail-value available">
            Available
          </div>

        </div>

      </div>


      <div class="confirmation-action">

        <button
          id="purchaseButton"
          class="buy-button"
        >
          <i class="fa-solid fa-cart-shopping"></i>
          Buy Number
        </button>

      </div>

    </section>


    <!-- SUCCESS -->

    <section
      id="successCard"
      class="confirmation-card success-card"
    >

      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h2>Number Purchased</h2>

      <p>
        Your number has been added to your Wavynum account.
      </p>

      <div
        id="purchasedNumber"
        class="success-number"
      >
      </div>

      <a
        href="my-numbers.html"
        class="numbers-link"
      >
        <i class="fa-solid fa-phone"></i>
        View My Numbers
      </a>

    </section>

  </main>


  <script type="module">

    import {
      auth,
      db
    } from "./firebase.js";


    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      doc,
      getDoc,
      setDoc,
      addDoc,
      collection,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const loadingBox =
      document.getElementById("loadingBox");

    const errorBox =
      document.getElementById("errorBox");

    const errorText =
      document.getElementById("errorText");

    const confirmationCard =
      document.getElementById("confirmationCard");

    const successCard =
      document.getElementById("successCard");

    const actualNumber =
      document.getElementById("actualNumber");

    const numberPrice =
      document.getElementById("numberPrice");

    const countryName =
      document.getElementById("countryName");

    const provider =
      document.getElementById("provider");

    const serviceName =
      document.getElementById("serviceName");

    const purchaseButton =
      document.getElementById("purchaseButton");

    const purchasedNumber =
      document.getElementById("purchasedNumber");


    let selectedNumber = null;
    let firestoreNumber = null;


    function formatPrice(value) {

      const price =
        Number(value) || 0;

      return "$" + price.toFixed(2);

    }


    function showError(message) {

      loadingBox.style.display =
        "none";

      confirmationCard.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorText.textContent =
        message;

    }


    /*
      READ SELECTED NUMBER
    */

    try {

      const saved =
        localStorage.getItem(
          "wavynumSelectedNumber"
        );


      if (!saved) {

        throw new Error(
          "No number has been selected."
        );

      }


      selectedNumber =
        JSON.parse(saved);


      if (
        !selectedNumber ||
        !selectedNumber.id
      ) {

        throw new Error(
          "The selected number is missing its Firestore ID."
        );

      }

    } catch (error) {

      showError(
        error.message ||
        "Unable to read the selected number."
      );

    }


    /*
      LOAD NUMBER DIRECTLY FROM FIRESTORE
    */

    async function loadNumber() {

      if (
        !selectedNumber ||
        !selectedNumber.id
      ) {
        return;
      }


      try {

        const numberRef =
          doc(
            db,
            "numbers",
            selectedNumber.id
          );


        const snapshot =
          await getDoc(
            numberRef
          );


        if (!snapshot.exists()) {

          throw new Error(
            "This number no longer exists."
          );

        }


        const data =
          snapshot.data();


        const status =
          String(
            data.status || ""
          )
          .trim()
          .toLowerCase();


        if (
          status !== "available"
        ) {

          throw new Error(
            "Sorry, this number is no longer available."
          );

        }


        /*
          THIS IS THE FIX.

          Get the real phone number
          directly from Firestore.
        */

        const realNumber =
          String(
            data.number ?? ""
          ).trim();


        if (!realNumber) {

          throw new Error(
            "The phone number field is empty in this inventory record."
          );

        }


        firestoreNumber = {

          id:
            snapshot.id,

          number:
            realNumber,

          country:
            String(
              data.country ?? ""
            ).trim(),

          countryName:
            String(
              data.countryName ??
              "Unknown"
            ).trim(),

          price:
            Number(
              data.price
            ) || 0,

          provider:
            String(
              data.provider ??
              "Provider"
            ).trim(),

          service:
            String(
              selectedNumber.service ??
              ""
            ).trim()

        };


        /*
          DISPLAY ACTUAL NUMBER
        */

        actualNumber.textContent =
          firestoreNumber.number;


        numberPrice.textContent =
          formatPrice(
            firestoreNumber.price
          );


        countryName.textContent =
          firestoreNumber.countryName ||
          "Unknown";


        provider.textContent =
          firestoreNumber.provider ||
          "Provider";


        serviceName.textContent =
          firestoreNumber.service ||
          "Service";


        loadingBox.style.display =
          "none";

        confirmationCard.style.display =
          "block";

      } catch (error) {

        console.error(
          "Number loading error:",
          error
        );

        showError(
          error.message ||
          "Unable to load this number."
        );

      }

    }


    /*
      CHECK LOGIN
    */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          showError(
            "Please sign in before purchasing a number."
          );

          return;

        }


        await loadNumber();

      }
    );


    /*
      BUY NUMBER
    */

    purchaseButton.addEventListener(
      "click",
      async () => {

        const user =
          auth.currentUser;


        if (!user) {

          showError(
            "Please sign in before purchasing a number."
          );

          return;

        }


        if (
          !firestoreNumber ||
          !firestoreNumber.id
        ) {

          showError(
            "The selected number could not be loaded."
          );

          return;

        }


        purchaseButton.disabled =
          true;


        purchaseButton.innerHTML =
          `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Processing...
          `;


        try {

          const numberId =
            firestoreNumber.id;


          const numberRef =
            doc(
              db,
              "numbers",
              numberId
            );


          let purchasedNumberData =
            null;


          /*
            ATOMIC INVENTORY CHECK
          */

          await runTransaction(
            db,
            async (transaction) => {

              const numberSnapshot =
                await transaction.get(
                  numberRef
                );


              if (
                !numberSnapshot.exists()
              ) {

                throw new Error(
                  "This number no longer exists."
                );

              }


              const numberData =
                numberSnapshot.data();


              const status =
                String(
                  numberData.status || ""
                )
                .trim()
                .toLowerCase();


              if (
                status !== "available"
              ) {

                throw new Error(
                  "Sorry, this number has already been purchased."
                );

              }


              const realNumber =
                String(
                  numberData.number ?? ""
                ).trim();


              if (!realNumber) {

                throw new Error(
                  "The phone number is missing from the inventory record."
                );

              }


              purchasedNumberData = {

                id:
                  numberId,

                number:
                  realNumber,

                country:
                  numberData.country ||
                  "",

                countryName:
                  numberData.countryName ||
                  "Unknown",

                price:
                  Number(
                    numberData.price
                  ) || 0,

                provider:
                  numberData.provider ||
                  "Provider",

                service:
                  selectedNumber.service ||
                  ""

              };


              transaction.update(
                numberRef,
                {

                  status:
                    "sold",

                  ownerId:
                    user.uid,

                  soldService:
                    selectedNumber.service ||
                    "",

                  soldAt:
                    serverTimestamp()

                }
              );

            }
          );


          /*
            USER NUMBER
          */

          await setDoc(

            doc(
              db,
              "users",
              user.uid,
              "numbers",
              numberId
            ),

            {

              numberId:
                numberId,

              number:
                purchasedNumberData.number,

              country:
                purchasedNumberData.country,

              countryName:
                purchasedNumberData.countryName,

              price:
                purchasedNumberData.price,

              provider:
                purchasedNumberData.provider,

              service:
                purchasedNumberData.service,

              status:
                "active",

              purchasedAt:
                serverTimestamp()

            }

          );


          /*
            PURCHASE RECORD
          */

          await addDoc(

            collection(
              db,
              "purchases"
            ),

            {

              userId:
                user.uid,

              numberId:
                numberId,

              number:
                purchasedNumberData.number,

              country:
                purchasedNumberData.country,

              countryName:
                purchasedNumberData.countryName,

              price:
                purchasedNumberData.price,

              provider:
                purchasedNumberData.provider,

              service:
                purchasedNumberData.service,

              status:
                "completed",

              createdAt:
                serverTimestamp()

            }

          );


          /*
            TRANSACTION RECORD
          */

          await addDoc(

            collection(
              db,
              "transactions"
            ),

            {

              userId:
                user.uid,

              type:
                "number_purchase",

              numberId:
                numberId,

              number:
                purchasedNumberData.number,

              amount:
                purchasedNumberData.price,

              currency:
                "USD",

              status:
                "completed",

              createdAt:
                serverTimestamp()

            }

          );


          /*
            SUCCESS
          */

          localStorage.removeItem(
            "wavynumSelectedNumber"
          );


          purchasedNumber.textContent =
            purchasedNumberData.number;


          confirmationCard.style.display =
            "none";


          successCard.style.display =
            "block";


        } catch (error) {

          console.error(
            "Purchase error:",
            error
          );


          purchaseButton.disabled =
            false;


          purchaseButton.innerHTML =
            `
              <i class="fa-solid fa-cart-shopping"></i>
              Buy Number
            `;


          errorBox.style.display =
            "block";

          errorText.textContent =
            error.message ||
            "Purchase failed. Please try again.";

        }

      }
    );

  </script>

</body>
</html>
