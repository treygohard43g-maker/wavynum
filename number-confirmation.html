<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirm Purchase — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=7">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    .confirmation-main {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .confirmation-header {
      margin-bottom: 22px;
    }

    .confirmation-card {
      background: #fff;
      border: 1px solid #e8e8ee;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .service-box {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid #eee;
    }

    .service-icon {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: #f1f3f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .service-box h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    .service-box p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .number-display {
      text-align: center;
      padding: 28px 10px;
    }

    .number-display span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .number-display strong {
      font-size: 26px;
      letter-spacing: .3px;
    }

    .details {
      border-top: 1px solid #eee;
      padding-top: 16px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      font-size: 14px;
    }

    .detail-row span:first-child {
      color: #777;
    }

    .detail-row strong {
      text-align: right;
    }

    .wallet-box {
      margin-top: 18px;
      padding: 15px;
      border-radius: 16px;
      background: #f6f8fb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wallet-box span {
      color: #666;
      font-size: 14px;
    }

    .wallet-box strong {
      font-size: 18px;
    }

    .buy-button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      margin-top: 18px;
      background: #111827;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .buy-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 13px;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      background: #edfdf3;
      color: #087443;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }
  </style>
</head>

<body class="dashboard-page">

  <header class="dashboard-header">

    <a href="buy-number.html" class="dashboard-logo">
      Wavynum
    </a>

    <a
      href="number-selection.html"
      class="back-button"
      aria-label="Back"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </a>

  </header>


  <main class="confirmation-main">

    <section class="confirmation-header">

      <p class="dashboard-eyebrow">
        PURCHASE
      </p>

      <h1>
        Confirm your number
      </h1>

      <p class="dashboard-subtitle">
        Review the details before completing your purchase.
      </p>

    </section>


    <div id="loadingState" class="loading">
      Loading purchase details...
    </div>


    <section
      id="confirmationContent"
      class="confirmation-card"
      style="display:none;"
    >

      <div class="service-box">

        <div class="service-icon">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <div>
          <h2 id="serviceName">
            Service
          </h2>

          <p id="countryName">
            Country
          </p>
        </div>

      </div>


      <div class="number-display">

        <span>
          Selected number
        </span>

        <strong id="phoneNumber">
          —
        </strong>

      </div>


      <div class="details">

        <div class="detail-row">
          <span>Service</span>
          <strong id="serviceDetail">—</strong>
        </div>

        <div class="detail-row">
          <span>Country</span>
          <strong id="countryDetail">—</strong>
        </div>

        <div class="detail-row">
          <span>Purchase price</span>
          <strong id="priceDetail">$0.00</strong>
        </div>

      </div>


      <div class="wallet-box">

        <span>
          USD wallet balance
        </span>

        <strong id="walletBalance">
          $0.00
        </strong>

      </div>


      <button
        type="button"
        id="buyButton"
        class="buy-button"
      >
        Buy Number
      </button>


      <div id="message" class="message"></div>


      <a
        href="number-selection.html"
        class="back-link"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Choose another number
      </a>

    </section>

  </main>


  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      runTransaction,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const selectedRaw =
      localStorage.getItem("wavynumSelectedNumber");


    const loadingState =
      document.getElementById("loadingState");

    const confirmationContent =
      document.getElementById("confirmationContent");

    const serviceName =
      document.getElementById("serviceName");

    const countryName =
      document.getElementById("countryName");

    const phoneNumber =
      document.getElementById("phoneNumber");

    const serviceDetail =
      document.getElementById("serviceDetail");

    const countryDetail =
      document.getElementById("countryDetail");

    const priceDetail =
      document.getElementById("priceDetail");

    const walletBalance =
      document.getElementById("walletBalance");

    const buyButton =
      document.getElementById("buyButton");

    const message =
      document.getElementById("message");


    if (!selectedRaw) {

      loadingState.innerHTML = `
        <p>No number has been selected.</p>
        <a href="buy-number.html">Return to Buy Number</a>
      `;

      throw new Error("No selected number");

    }


    const selectedNumber =
      JSON.parse(selectedRaw);


    const price =
      Number(selectedNumber.price || 0);


    serviceName.textContent =
      selectedNumber.service || "Service";

    countryName.textContent =
      selectedNumber.countryName || selectedNumber.country || "Country";

    phoneNumber.textContent =
      selectedNumber.number || "—";

    serviceDetail.textContent =
      selectedNumber.service || "—";

    countryDetail.textContent =
      selectedNumber.countryName || selectedNumber.country || "—";

    priceDetail.textContent =
      "$" + price.toFixed(2);


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.className =
        "message";

      message.textContent = "";

    }


    function showWalletBalance(balance) {

      walletBalance.textContent =
        "$" + Number(balance).toFixed(2);

    }


    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }


      try {

        const userRef =
          doc(db, "users", user.uid);

        const userSnapshot =
          await getDoc(userRef);


        if (!userSnapshot.exists()) {

          loadingState.textContent =
            "Your wallet account could not be found.";

          return;

        }


        const userData =
          userSnapshot.data();


        // IMPORTANT:
        // The dashboard uses usdBalance.
        const usd =
          Number(userData.usdBalance || 0);


        showWalletBalance(usd);


        loadingState.style.display =
          "none";

        confirmationContent.style.display =
          "block";


        buyButton.addEventListener(
          "click",
          () => purchaseNumber(user)
        );


      } catch (error) {

        console.error(
          "Wallet loading error:",
          error
        );

        loadingState.textContent =
          "Unable to load your wallet balance.";

      }

    });


    async function purchaseNumber(user) {

      hideMessage();

      buyButton.disabled = true;

      buyButton.textContent =
        "Processing...";


      try {

        const userRef =
          doc(db, "users", user.uid);


        const numberId =
          selectedNumber.number
            .replace(/\D/g, "");


        const numberRef =
          doc(db, "numbers", numberId);


        const ownedNumberRef =
          doc(
            db,
            "users",
            user.uid,
            "numbers",
            numberId
          );


        const purchaseRef =
          doc(collection(db, "purchases"));


        const transactionRef =
          doc(collection(db, "transactions"));


        const otp =
          Math.floor(
            100000 +
            Math.random() * 900000
          ).toString();


        await runTransaction(
          db,
          async (transaction) => {

            const userSnapshot =
              await transaction.get(userRef);


            if (!userSnapshot.exists()) {

              throw new Error(
                "Wallet account not found."
              );

            }


            const userData =
              userSnapshot.data();


            // USE THE CORRECT USD FIELD
            const currentBalance =
              Number(
                userData.usdBalance || 0
              );


            if (currentBalance < price) {

              throw new Error(
                "Your USD wallet balance is too low for this purchase."
              );

            }


            const numberSnapshot =
              await transaction.get(numberRef);


            if (numberSnapshot.exists()) {

              throw new Error(
                "This number has already been purchased."
              );

            }


            const newBalance =
              currentBalance - price;


            transaction.update(
              userRef,
              {
                usdBalance: newBalance
              }
            );


            transaction.set(
              numberRef,
              {
                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "sold",

                ownerId:
                  user.uid,

                soldAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              ownedNumberRef,
              {
                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "active",

                demoOtp:
                  otp,

                purchasedAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              purchaseRef,
              {
                userId:
                  user.uid,

                numberId:
                  numberId,

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                price:
                  price,

                status:
                  "completed",

                purchasedAt:
                  serverTimestamp()
              }
            );


            transaction.set(
              transactionRef,
              {
                userId:
                  user.uid,

                type:
                  "number_purchase",

                amount:
                  -price,

                currency:
                  "USD",

                description:
                  "Purchased " +
                  selectedNumber.service +
                  " number",

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                createdAt:
                  serverTimestamp()
              }
            );

          }
        );


        localStorage.removeItem(
          "wavynumSelectedNumber"
        );


        showMessage(
          "Number purchased successfully.",
          "success"
        );


        buyButton.textContent =
          "Purchase Complete";


        setTimeout(() => {

          window.location.href =
            "my-numbers.html";

        }, 900);


      } catch (error) {

        console.error(
          "Purchase error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to complete purchase.",
          "error"
        );


        buyButton.disabled =
          false;

        buyButton.textContent =
          "Buy Number";

      }

    }

  </script>

</body>
</html>
