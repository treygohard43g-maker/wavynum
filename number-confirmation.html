<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirm Purchase — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=7">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    /* =========================
       WAVYNUM CONFIRMATION
    ========================= */

    .confirmation-page {
      min-height: 100vh;
      background: #050806;
      color: #f0fdf4;
    }

    .confirmation-main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 55px 20px 80px;
    }

    .confirmation-header {
      margin-bottom: 30px;
    }

    .confirmation-header .dashboard-eyebrow {
      color: #39e86f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.7px;
    }

    .confirmation-header h1 {
      margin-top: 10px;
      color: #ecfdf3;
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.08;
      letter-spacing: -2px;
    }

    .confirmation-header p:last-child {
      margin-top: 13px;
      color: #78857d;
      font-size: 15px;
    }

    /* MAIN CARD */

    .confirmation-card {
      background:
        linear-gradient(
          145deg,
          #0c140f,
          #080d0a
        );

      border: 1px solid rgba(34, 197, 94, 0.14);

      border-radius: 22px;

      padding: 25px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.30);
    }

    /* SERVICE */

    .service-row {
      display: flex;
      align-items: center;
      gap: 15px;

      padding-bottom: 22px;

      border-bottom:
        1px solid rgba(34, 197, 94, 0.10);
    }

    .service-icon {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        rgba(34, 197, 94, 0.09);

      border:
        1px solid rgba(34, 197, 94, 0.16);

      color: #39e86f;

      font-size: 21px;
    }

    .service-info h2 {
      color: #ecfdf3;
      font-size: 19px;
      margin-bottom: 3px;
    }

    .service-info p {
      color: #78857d;
      font-size: 13px;
    }

    /* NUMBER */

    .selected-number {
      text-align: center;

      padding: 34px 10px;
    }

    .selected-number-label {
      display: block;

      margin-bottom: 9px;

      color: #58645b;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .selected-number strong {
      display: block;

      color: #39e86f;

      font-size: clamp(25px, 7vw, 34px);

      font-weight: 800;

      letter-spacing: -0.5px;
    }

    /* DETAILS */

    .details-box {
      padding-top: 5px;

      border-top:
        1px solid rgba(34, 197, 94, 0.10);
    }

    .detail-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 14px 2px;

      border-bottom:
        1px solid rgba(34, 197, 94, 0.06);
    }

    .detail-row span {
      color: #78857d;
      font-size: 14px;
    }

    .detail-row strong {
      color: #ecfdf3;
      font-size: 14px;
      text-align: right;
    }

    .detail-row:last-child strong {
      color: #39e86f;
      font-size: 17px;
    }

    /* WALLET */

    .wallet-card {
      margin-top: 20px;

      padding: 18px;

      background:
        rgba(34, 197, 94, 0.055);

      border:
        1px solid rgba(34, 197, 94, 0.14);

      border-radius: 16px;
    }

    .wallet-card-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .wallet-label {
      color: #78857d;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1.2px;

      text-transform: uppercase;
    }

    .wallet-amount {
      margin-top: 5px;

      color: #39e86f;

      font-size: 24px;

      font-weight: 800;
    }

    .wallet-icon-small {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(34, 197, 94, 0.10);

      border:
        1px solid rgba(34, 197, 94, 0.14);

      color: #39e86f;
    }

    /* BUY BUTTON */

    .buy-button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: none;

      border-radius: 11px;

      background: #22c55e;

      color: #031108;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(34, 197, 94, 0.14);

      transition: .2s ease;
    }

    .buy-button:hover {
      background: #39e86f;

      transform: translateY(-2px);
    }

    .buy-button:disabled {
      opacity: .55;

      cursor: not-allowed;

      transform: none;
    }

    /* BACK */

    .back-link {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 7px;

      margin-top: 20px;

      color: #68756c;

      text-decoration: none;

      font-size: 13px;

      transition: .2s ease;
    }

    .back-link:hover {
      color: #39e86f;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-top: 15px;

      padding: 13px 14px;

      border-radius: 11px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(220, 38, 38, .10);

      border:
        1px solid rgba(220, 38, 38, .20);

      color: #ff9b9b;
    }

    .message.success {
      background:
        rgba(34, 197, 94, .09);

      border:
        1px solid rgba(34, 197, 94, .20);

      color: #86efac;
    }

    /* LOADING */

    .loading {
      padding: 60px 20px;

      text-align: center;

      color: #78857d;
    }

    .loading i {
      display: block;

      margin-bottom: 12px;

      color: #39e86f;

      font-size: 23px;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .confirmation-main {
        padding:
          35px
          16px
          60px;
      }

      .confirmation-header {
        margin-bottom: 23px;
      }

      .confirmation-header h1 {
        font-size: 34px;
        letter-spacing: -1.5px;
      }

      .confirmation-card {
        padding: 18px;

        border-radius: 18px;
      }

      .selected-number {
        padding: 28px 5px;
      }

      .selected-number strong {
        font-size: 25px;
      }

    }

    @media (max-width: 380px) {

      .confirmation-main {
        padding-left: 13px;
        padding-right: 13px;
      }

      .confirmation-card {
        padding: 15px;
      }

      .service-icon {
        width: 48px;
        height: 48px;
      }

      .detail-row {
        font-size: 13px;
      }

      .wallet-amount {
        font-size: 21px;
      }

    }
  </style>
</head>


<body class="confirmation-page dashboard-page">


  <!-- HEADER -->

  <header class="dashboard-header">

    <a
      href="buy-number.html"
      class="dashboard-logo"
    >
      Wavynum
    </a>

    <a
      href="number-selection.html"
      class="back-button"
      aria-label="Back"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </a>

  </header>


  <!-- MAIN -->

  <main class="confirmation-main">


    <!-- TITLE -->

    <section class="confirmation-header">

      <p class="dashboard-eyebrow">
        PURCHASE
      </p>

      <h1>
        Confirm your number
      </h1>

      <p>
        Review the details before completing your purchase.
      </p>

    </section>


    <!-- LOADING -->

    <div
      id="loadingState"
      class="loading"
    >

      <i class="fa-solid fa-spinner fa-spin"></i>

      Loading purchase details...

    </div>


    <!-- CARD -->

    <section
      id="confirmationContent"
      class="confirmation-card"
      style="display:none;"
    >


      <!-- SERVICE -->

      <div class="service-row">

        <div class="service-icon">

          <i class="fa-solid fa-mobile-screen-button"></i>

        </div>

        <div class="service-info">

          <h2 id="serviceName">
            Service
          </h2>

          <p id="countryName">
            Country
          </p>

        </div>

      </div>


      <!-- NUMBER -->

      <div class="selected-number">

        <span class="selected-number-label">
          Selected Number
        </span>

        <strong id="phoneNumber">
          —
        </strong>

      </div>


      <!-- DETAILS -->

      <div class="details-box">

        <div class="detail-row">

          <span>
            Service
          </span>

          <strong id="serviceDetail">
            —
          </strong>

        </div>


        <div class="detail-row">

          <span>
            Country
          </span>

          <strong id="countryDetail">
            —
          </strong>

        </div>


        <div class="detail-row">

          <span>
            Purchase price
          </span>

          <strong id="priceDetail">
            $0.00
          </strong>

        </div>

      </div>


      <!-- WALLET -->

      <div class="wallet-card">

        <div class="wallet-card-top">

          <div>

            <div class="wallet-label">
              USD Wallet Balance
            </div>

            <div
              id="walletBalance"
              class="wallet-amount"
            >
              $0.00
            </div>

          </div>

          <div class="wallet-icon-small">

            <i class="fa-solid fa-dollar-sign"></i>

          </div>

        </div>

      </div>


      <!-- PURCHASE -->

      <button
        type="button"
        id="buyButton"
        class="buy-button"
      >
        Buy Number
      </button>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- BACK -->

      <a
        href="number-selection.html"
        class="back-link"
      >

        <i class="fa-solid fa-arrow-left"></i>

        Choose another number

      </a>


    </section>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      runTransaction,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const selectedRaw =
      localStorage.getItem(
        "wavynumSelectedNumber"
      );


    const loadingState =
      document.getElementById(
        "loadingState"
      );

    const confirmationContent =
      document.getElementById(
        "confirmationContent"
      );

    const serviceName =
      document.getElementById(
        "serviceName"
      );

    const countryName =
      document.getElementById(
        "countryName"
      );

    const phoneNumber =
      document.getElementById(
        "phoneNumber"
      );

    const serviceDetail =
      document.getElementById(
        "serviceDetail"
      );

    const countryDetail =
      document.getElementById(
        "countryDetail"
      );

    const priceDetail =
      document.getElementById(
        "priceDetail"
      );

    const walletBalance =
      document.getElementById(
        "walletBalance"
      );

    const buyButton =
      document.getElementById(
        "buyButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    /* =========================
       SELECTED NUMBER
    ========================= */

    if (!selectedRaw) {

      loadingState.innerHTML = `
        <p>No number has been selected.</p>
        <a href="buy-number.html">
          Return to Buy Number
        </a>
      `;

      throw new Error(
        "No selected number"
      );

    }


    const selectedNumber =
      JSON.parse(selectedRaw);


    const price =
      Number(
        selectedNumber.price || 0
      );


    serviceName.textContent =
      selectedNumber.service ||
      "Service";


    countryName.textContent =
      selectedNumber.countryName ||
      selectedNumber.country ||
      "Country";


    phoneNumber.textContent =
      selectedNumber.number ||
      "—";


    serviceDetail.textContent =
      selectedNumber.service ||
      "—";


    countryDetail.textContent =
      selectedNumber.countryName ||
      selectedNumber.country ||
      "—";


    priceDetail.textContent =
      "$" + price.toFixed(2);


    /* =========================
       MESSAGES
    ========================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    function showWalletBalance(
      balance
    ) {

      walletBalance.textContent =
        "$" +
        Number(balance).toFixed(2);

    }


    /* =========================
       AUTH + WALLET
    ========================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        try {

          const userRef =
            doc(
              db,
              "users",
              user.uid
            );


          const userSnapshot =
            await getDoc(
              userRef
            );


          if (!userSnapshot.exists()) {

            loadingState.textContent =
              "Your wallet account could not be found.";

            return;

          }


          const userData =
            userSnapshot.data();


          /* Wavynum USD field */

          const usd =
            Number(
              userData.usdBalance || 0
            );


          showWalletBalance(
            usd
          );


          loadingState.style.display =
            "none";


          confirmationContent.style.display =
            "block";


          buyButton.addEventListener(
            "click",
            () => purchaseNumber(user)
          );


        } catch (error) {

          console.error(
            "Wallet loading error:",
            error
          );


          loadingState.textContent =
            "Unable to load your wallet balance.";

        }

      }
    );


    /* =========================
       PURCHASE
    ========================= */

    async function purchaseNumber(
      user
    ) {

      hideMessage();

      buyButton.disabled =
        true;

      buyButton.textContent =
        "Processing...";


      try {

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const numberId =
          selectedNumber.number
            .replace(
              /\D/g,
              ""
            );


        const numberRef =
          doc(
            db,
            "numbers",
            numberId
          );


        const ownedNumberRef =
          doc(
            db,
            "users",
            user.uid,
            "numbers",
            numberId
          );


        const purchaseRef =
          doc(
            collection(
              db,
              "purchases"
            )
          );


        const transactionRef =
          doc(
            collection(
              db,
              "transactions"
            )
          );


        const otp =
          Math.floor(
            100000 +
            Math.random() *
            900000
          ).toString();


        await runTransaction(
          db,
          async (transaction) => {

            const userSnapshot =
              await transaction.get(
                userRef
              );


            if (!userSnapshot.exists()) {

              throw new Error(
                "Wallet account not found."
              );

            }


            const userData =
              userSnapshot.data();


            const currentBalance =
              Number(
                userData.usdBalance || 0
              );


            if (
              currentBalance <
              price
            ) {

              throw new Error(
                "Your USD wallet balance is too low for this purchase."
              );

            }


            const numberSnapshot =
              await transaction.get(
                numberRef
              );


            if (
              numberSnapshot.exists()
            ) {

              throw new Error(
                "This number has already been purchased."
              );

            }


            const newBalance =
              currentBalance -
              price;


            /* UPDATE USD */

            transaction.update(
              userRef,
              {
                usdBalance:
                  newBalance
              }
            );


            /* INVENTORY */

            transaction.set(
              numberRef,
              {

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "sold",

                ownerId:
                  user.uid,

                soldAt:
                  serverTimestamp()

              }
            );


            /* USER NUMBER */

            transaction.set(
              ownedNumberRef,
              {

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                countryName:
                  selectedNumber.countryName,

                price:
                  price,

                status:
                  "active",

                demoOtp:
                  otp,

                purchasedAt:
                  serverTimestamp()

              }
            );


            /* PURCHASE */

            transaction.set(
              purchaseRef,
              {

                userId:
                  user.uid,

                numberId:
                  numberId,

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                country:
                  selectedNumber.country,

                price:
                  price,

                status:
                  "completed",

                purchasedAt:
                  serverTimestamp()

              }
            );


            /* TRANSACTION */

            transaction.set(
              transactionRef,
              {

                userId:
                  user.uid,

                type:
                  "number_purchase",

                amount:
                  -price,

                currency:
                  "USD",

                description:
                  "Purchased " +
                  selectedNumber.service +
                  " number",

                number:
                  selectedNumber.number,

                service:
                  selectedNumber.service,

                createdAt:
                  serverTimestamp()

              }
            );

          }
        );


        localStorage.removeItem(
          "wavynumSelectedNumber"
        );


        showMessage(
          "Number purchased successfully.",
          "success"
        );


        buyButton.textContent =
          "Purchase Complete";


        setTimeout(
          () => {

            window.location.href =
              "my-numbers.html";

          },
          900
        );


      } catch (error) {

        console.error(
          "Purchase error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to complete purchase.",
          "error"
        );


        buyButton.disabled =
          false;

        buyButton.textContent =
          "Buy Number";

      }

    }

  </script>

</body>
</html>
