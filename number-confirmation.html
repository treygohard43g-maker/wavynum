<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Choose Number - Wavynum</title>

  <link rel="stylesheet" href="style.css?v=11">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .selection-page {
      min-height: 100vh;
      padding: 16px 12px 30px;
    }

    .selection-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    /* HEADER */

    .top-bar {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 15px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #111827;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
      cursor: pointer;
      flex-shrink: 0;
    }

    .title-area {
      min-width: 0;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }

    .page-subtitle {
      color: #6b7280;
      font-size: 12px;
      margin-top: 3px;
    }

    /* SERVICE HEADER */

    .service-card {
      background: #fff;
      border-radius: 17px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      margin-bottom: 12px;
    }

    .service-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .service-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .service-logo i {
      font-size: 20px;
      color: #6b7280;
    }

    .service-name {
      font-size: 16px;
      font-weight: 800;
    }

    .service-description {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #4b5563;
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    /* RESULT INFO */

    .result-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 9px;
    }

    .result-count {
      color: #6b7280;
      font-size: 12px;
    }

    .secure-label {
      color: #16a34a;
      font-size: 11px;
      font-weight: 700;
    }

    /* NUMBER LIST */

    .numbers-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* NUMBER CARD */

    .number-card {
      background: #fff;
      border-radius: 17px;
      padding: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,.055);
      border: 1px solid #edf0f4;
    }

    .number-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .number-main {
      min-width: 0;
    }

    .number-label {
      color: #6b7280;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    /* ACTUAL PHONE NUMBER */

    .actual-number {
      font-size: 20px;
      font-weight: 900;
      color: #111827;
      letter-spacing: .3px;
      line-height: 1.15;
      word-break: break-word;
    }

    .price-box {
      flex-shrink: 0;
      text-align: right;
    }

    .price {
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .price-label {
      color: #9ca3af;
      font-size: 9px;
      margin-top: 1px;
    }

    /* CARD DETAILS */

    .number-details {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 9px;
    }

    .detail-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f7f8fa;
      color: #596273;
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 600;
    }

    .detail-pill i {
      font-size: 9px;
    }

    /* CHOOSE BUTTON */

    .choose-btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      background: #111827;
      color: #fff;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .choose-btn:active {
      transform: scale(.99);
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #6b7280;
    }

    .loading i {
      font-size: 25px;
      margin-bottom: 10px;
    }

    /* EMPTY */

    .empty-state {
      background: #fff;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.05);
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #f3f4f6;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 22px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .empty-text {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ERROR */

    .error-box {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
      border-radius: 13px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (min-width: 600px) {

      .selection-page {
        padding: 24px 18px 40px;
      }

      .numbers-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .actual-number {
        font-size: 18px;
      }

    }

  </style>
</head>

<body>

<div class="selection-page">

  <div class="selection-container">

    <!-- HEADER -->

    <div class="top-bar">

      <button
        class="back-btn"
        id="backBtn"
        aria-label="Go back"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <div class="title-area">

        <div class="page-title">
          Choose a Number
        </div>

        <div class="page-subtitle">
          Select the number you want to purchase
        </div>

      </div>

    </div>


    <!-- SERVICE -->

    <div class="service-card">

      <div class="service-logo" id="serviceLogo">
        <i class="fa-solid fa-phone"></i>
      </div>

      <div>

        <div
          class="service-name"
          id="serviceName"
        >
          Loading...
        </div>

        <div class="service-description">
          Available virtual numbers
        </div>

      </div>

    </div>


    <!-- COUNTRY FILTER -->

    <div class="filters">

      <button
        class="filter-btn active"
        data-country="all"
      >
        All
      </button>

      <button
        class="filter-btn"
        data-country="US"
      >
        🇺🇸 United States
      </button>

      <button
        class="filter-btn"
        data-country="UK"
      >
        🇬🇧 United Kingdom
      </button>

      <button
        class="filter-btn"
        data-country="CA"
      >
        🇨🇦 Canada
      </button>

    </div>


    <!-- RESULTS INFO -->

    <div class="result-info">

      <div
        class="result-count"
        id="resultCount"
      >
        Loading numbers...
      </div>

      <div class="secure-label">
        <i class="fa-solid fa-shield-halved"></i>
        Secure
      </div>

    </div>


    <!-- CONTENT -->

    <div id="loading" class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <div>
        Loading available numbers...
      </div>

    </div>


    <div
      id="numbersList"
      class="numbers-list"
    ></div>


  </div>

</div>


<script type="module">

  import { db } from "./firebase.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  const serviceName =
    document.getElementById("serviceName");

  const serviceLogo =
    document.getElementById("serviceLogo");

  const loading =
    document.getElementById("loading");

  const numbersList =
    document.getElementById("numbersList");

  const resultCount =
    document.getElementById("resultCount");

  const backBtn =
    document.getElementById("backBtn");


  let selectedService = "";

  let allNumbers = [];

  let activeCountry = "all";


  /*
   * SERVICE LOGOS
   */

  const serviceLogos = {

    "facebook":
      "https://cdn.simpleicons.org/facebook/1877F2",

    "whatsapp":
      "https://cdn.simpleicons.org/whatsapp/25D366",

    "instagram":
      "https://cdn.simpleicons.org/instagram/E4405F",

    "telegram":
      "https://cdn.simpleicons.org/telegram/26A5E4",

    "snapchat":
      "https://cdn.simpleicons.org/snapchat/FFFC00",

    "google voice":
      "https://cdn.simpleicons.org/googlevoice/4285F4",

    "textplus":
      "https://cdn.simpleicons.org/textplus/4CAF50",

    "textnow":
      "https://cdn.simpleicons.org/textnow/00A8FF",

    "textfree":
      "https://cdn.simpleicons.org/textfree/1DA1F2",

    "hushed":
      "https://cdn.simpleicons.org/hushed/111111",

    "burner":
      "https://cdn.simpleicons.org/burner/111111",

    "2ndline":
      "https://cdn.simpleicons.org/2ndline/111111",

    "freetone":
      "https://cdn.simpleicons.org/freetone/111111",

    "coverme":
      "https://cdn.simpleicons.org/coverme/111111",

    "numero":
      "https://cdn.simpleicons.org/numero/111111",

    "mysudo":
      "https://cdn.simpleicons.org/mysudo/111111",

    "twitter / x":
      "https://cdn.simpleicons.org/x/000000"

  };


  /*
   * NORMALIZE SERVICE
   */

  function normalizeService(value) {

    return String(value || "")
      .trim()
      .toLowerCase();

  }


  /*
   * NORMALIZE COUNTRY
   */

  function normalizeCountry(value) {

    return String(value || "")
      .trim()
      .toUpperCase();

  }


  /*
   * GET SERVICE FROM URL
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  selectedService =
    params.get("service") || "";


  selectedService =
    decodeURIComponent(
      selectedService
    ).trim();


  if (!selectedService) {

    serviceName.textContent =
      "Service not selected";

  } else {

    serviceName.textContent =
      selectedService;

  }


  /*
   * DISPLAY SERVICE LOGO
   */

  function displayServiceLogo() {

    const key =
      normalizeService(selectedService);

    const logo =
      serviceLogos[key];


    if (!logo) {

      serviceLogo.innerHTML =
        '<i class="fa-solid fa-phone"></i>';

      return;

    }


    serviceLogo.innerHTML = `
      <img
        src="${logo}"
        alt="${selectedService}"
        onerror="
          this.style.display='none';
          this.parentElement.innerHTML='<i class=&quot;fa-solid fa-phone&quot;></i>';
        "
      >
    `;

  }


  displayServiceLogo();


  /*
   * COUNTRY FLAG
   */

  function getCountryFlag(country) {

    const code =
      normalizeCountry(country);


    if (code === "US") return "🇺🇸";

    if (code === "UK") return "🇬🇧";

    if (code === "GB") return "🇬🇧";

    if (code === "CA") return "🇨🇦";

    return "🌍";

  }


  /*
   * FORMAT PRICE
   */

  function formatPrice(value) {

    const amount =
      Number(value) || 0;

    return "$" + amount.toFixed(2);

  }


  /*
   * LOAD NUMBERS
   */

  async function loadNumbers() {

    loading.style.display = "block";

    numbersList.innerHTML = "";

    resultCount.textContent =
      "Loading numbers...";


    try {

      if (!selectedService) {

        throw new Error(
          "No service was selected."
        );

      }


      /*
       * IMPORTANT:
       *
       * The inventory collection is:
       *
       * numbers
       *
       * not:
       *
       * number
       */

      const snapshot =
        await getDocs(
          collection(db, "numbers")
        );


      allNumbers = [];


      snapshot.forEach((docSnapshot) => {

        const data =
          docSnapshot.data();


        /*
         * Only show available inventory.
         */

        const status =
          String(data.status || "")
            .trim()
            .toLowerCase();


        if (status !== "available") {
          return;
        }


        /*
         * SERVICES MUST BE AN ARRAY.
         */

        const services =
          Array.isArray(data.services)
            ? data.services
            : [];


        /*
         * Compare normalized values.
         *
         * This handles values such as:
         *
         * "WhatsApp"
         * " whatsapp "
         * "FACEBOOK"
         */

        const selected =
          normalizeService(
            selectedService
          );


        const supportsService =
          services.some((item) => {

            return normalizeService(item)
              === selected;

          });


        if (!supportsService) {
          return;
        }


        /*
         * Store the REAL Firestore
         * document ID.
         */

        allNumbers.push({

          id: docSnapshot.id,

          number:
            data.number || "",

          country:
            data.country || "",

          countryName:
            data.countryName ||
            "Unknown",

          price:
            Number(data.price) || 0,

          provider:
            data.provider ||
            "Provider",

          services:
            services

        });

      });


      /*
       * Sort cheapest first.
       */

      allNumbers.sort(
        (a, b) =>
          a.price - b.price
      );


      loading.style.display = "none";

      renderNumbers();

    } catch (error) {

      console.error(
        "Error loading numbers:",
        error
      );


      loading.style.display = "none";

      resultCount.textContent =
        "Unable to load numbers";


      numbersList.innerHTML = `
        <div class="error-box">
          <strong>Unable to load numbers</strong>
          <br><br>
          ${error.message}
        </div>
      `;

    }

  }


  /*
   * RENDER NUMBERS
   */

  function renderNumbers() {

    numbersList.innerHTML = "";


    let filteredNumbers =
      allNumbers;


    /*
     * COUNTRY FILTER
     */

    if (activeCountry !== "all") {

      filteredNumbers =
        allNumbers.filter((item) => {

          const country =
            normalizeCountry(
              item.country
            );


          if (
            activeCountry === "UK"
            && country === "GB"
          ) {
            return true;
          }


          return country ===
            activeCountry;

        });

    }


    resultCount.textContent =
      `${filteredNumbers.length} number${
        filteredNumbers.length === 1
          ? ""
          : "s"
      } available`;


    if (filteredNumbers.length === 0) {

      numbersList.innerHTML = `

        <div class="empty-state">

          <div class="empty-icon">
            <i class="fa-solid fa-phone-slash"></i>
          </div>

          <div class="empty-title">
            No numbers available
          </div>

          <div class="empty-text">
            There are currently no available
            numbers for this service and country.
          </div>

        </div>

      `;

      return;

    }


    filteredNumbers.forEach((item) => {

      const card =
        document.createElement("div");

      card.className =
        "number-card";


      /*
       * ACTUAL NUMBER IS DISPLAYED HERE.
       */

      card.innerHTML = `

        <div class="number-top">

          <div class="number-main">

            <div class="number-label">
              Phone Number
            </div>

            <div class="actual-number">
              ${escapeHtml(
                item.number || "Unknown"
              )}
            </div>

          </div>


          <div class="price-box">

            <div class="price">
              ${formatPrice(item.price)}
            </div>

            <div class="price-label">
              USD
            </div>

          </div>

        </div>


        <div class="number-details">

          <div class="detail-pill">

            <i class="fa-solid fa-globe"></i>

            ${getCountryFlag(item.country)}

            ${escapeHtml(
              item.countryName
            )}

          </div>


          <div class="detail-pill">

            <i class="fa-solid fa-server"></i>

            ${escapeHtml(
              item.provider
            )}

          </div>


          <div class="detail-pill">

            <i class="fa-solid fa-circle-check"></i>

            Available

          </div>

        </div>


        <button
          class="choose-btn"
          data-id="${escapeAttribute(
            item.id
          )}"
        >

          Choose Number

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      `;


      numbersList.appendChild(card);

    });


    /*
     * CHOOSE BUTTONS
     */

    document
      .querySelectorAll(".choose-btn")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.id;


            const item =
              allNumbers.find(
                number =>
                  number.id === id
              );


            if (!item) {

              alert(
                "This number could not be found."
              );

              return;

            }


            /*
             * Save the REAL Firestore
             * document ID.
             */

            const selectedNumber = {

              id: item.id,

              service:
                selectedService,

              number:
                item.number,

              country:
                item.country,

              countryName:
                item.countryName,

              price:
                item.price,

              provider:
                item.provider

            };


            localStorage.setItem(
              "wavynumSelectedNumber",
              JSON.stringify(
                selectedNumber
              )
            );


            window.location.href =
              "number-confirmation.html";

          }
        );

      });

  }


  /*
   * ESCAPE HTML
   */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * ESCAPE ATTRIBUTE
   */

  function escapeAttribute(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  }


  /*
   * COUNTRY FILTER BUTTONS
   */

  document
    .querySelectorAll(".filter-btn")
    .forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".filter-btn")
            .forEach((btn) => {

              btn.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );


          activeCountry =
            button.dataset.country;


          renderNumbers();

        }
      );

    });


  /*
   * BACK
   */

  backBtn.addEventListener(
    "click",
    () => {

      window.location.href =
        "buy-number.html";

    }
  );


  /*
   * START
   */

  loadNumbers();

</script>

</body>
</html>
