<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050806"
  >

  <title>Select Number | Wavynum</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css?v=13"
  >

  <link
    rel="stylesheet"
    href="number-selection.css?v=3"
  >
</head>


<body class="wavynum-number-selection">

  <main class="number-selection-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="selection-header">

      <a
        href="buy-number.html"
        class="selection-back"
        aria-label="Back to buy number"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </a>


      <div class="selection-heading">

        <span class="eyebrow">
          NUMBER MARKETPLACE
        </span>

        <h1>
          Select a number
        </h1>

        <p>
          Choose an available number for your service.
        </p>

      </div>

    </header>



    <!-- =====================================================
         SELECTED SERVICE
    ====================================================== -->

    <section
      class="service-summary"
      aria-labelledby="selectedServiceName"
    >

      <div class="service-summary-icon">

        <img
          id="selectedServiceLogo"
          src=""
          alt=""
        >

        <i
          id="selectedServiceFallback"
          class="fa-solid fa-layer-group"
          aria-hidden="true"
        ></i>

      </div>


      <div class="service-summary-content">

        <span class="section-label">
          SELECTED SERVICE
        </span>

        <h2 id="selectedServiceName">
          Loading...
        </h2>

      </div>

    </section>



    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <section class="inventory-controls">

      <div class="controls-header">

        <div>

          <span class="section-label">
            BROWSE INVENTORY
          </span>

          <h2>
            Available countries
          </h2>

        </div>

        <span
          id="inventoryCount"
          class="inventory-count"
        >
          —
        </span>

      </div>


      <div
        class="country-filter"
        role="group"
        aria-label="Filter by country"
      >

        <button
          type="button"
          class="country-filter-button active"
          data-country="all"
          aria-pressed="true"
        >
          <i class="fa-solid fa-earth-americas"></i>
          <span>All</span>
        </button>


        <button
          type="button"
          class="country-filter-button"
          data-country="US"
          aria-pressed="false"
        >
          <span class="country-code">
            US
          </span>
          <span>
            United States
          </span>
        </button>


        <button
          type="button"
          class="country-filter-button"
          data-country="CA"
          aria-pressed="false"
        >
          <span class="country-code">
            CA
          </span>
          <span>
            Canada
          </span>
        </button>


        <button
          type="button"
          class="country-filter-button"
          data-country="GB"
          aria-pressed="false"
        >
          <span class="country-code">
            GB
          </span>
          <span>
            United Kingdom
          </span>
        </button>

      </div>

    </section>



    <!-- =====================================================
         INVENTORY STATUS
    ====================================================== -->

    <div
      id="inventoryStatus"
      class="inventory-status"
      aria-live="polite"
    >
      Loading available numbers...
    </div>



    <!-- =====================================================
         NUMBER LIST
    ====================================================== -->

    <section
      id="numberList"
      class="number-list"
      aria-live="polite"
      aria-label="Available phone numbers"
    >

      <div class="number-state">

        <div class="state-icon">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>

        <h2>
          Loading numbers
        </h2>

        <p>
          Checking available inventory.
        </p>

      </div>

    </section>


  </main>


  <script
    type="module"
    src="number-selection.js?v=3"
  ></script>

</body>

</html>
