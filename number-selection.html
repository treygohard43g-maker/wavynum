<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Select Number | Wavynum</title>

  <link
    rel="stylesheet"
    href="style.css?v=11"
  >

  <link
    rel="stylesheet"
    href="number-selection.css?v=2"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body class="number-selection-page">

  <main class="number-selection-main">

    <!-- HEADER -->

    <header class="selection-header">

      <a
        href="buy-number.html"
        class="selection-back"
        aria-label="Back to buy number"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <div class="selection-heading">

        <span class="selection-eyebrow">
          Number marketplace
        </span>

        <h1>
          Select a number
        </h1>

        <p>
          Choose an available number for your service.
        </p>

      </div>

    </header>


    <!-- SELECTED SERVICE -->

    <section
      class="selected-service"
      aria-label="Selected service"
    >

      <div class="selected-service-logo">

        <img
          id="serviceLogo"
          alt=""
        >

        <i
          id="serviceFallbackIcon"
          class="fa-solid fa-layer-group"
          aria-hidden="true"
        ></i>

      </div>

      <div class="selected-service-info">

        <span class="selected-service-label">
          Service
        </span>

        <strong
          id="serviceName"
          class="selected-service-name"
        >
          Loading...
        </strong>

      </div>

    </section>


    <!-- COUNTRY FILTERS -->

    <section
      class="country-filter-section"
      aria-label="Filter numbers by country"
    >

      <div class="section-label">
        <i class="fa-solid fa-globe"></i>
        Country
      </div>

      <div class="filters">

        <button
          type="button"
          class="filter-btn active"
          data-country="all"
        >
          <i class="fa-solid fa-earth-americas"></i>
          All
        </button>

        <button
          type="button"
          class="filter-btn"
          data-country="US"
        >
          <i class="fa-solid fa-flag-usa"></i>
          United States
        </button>

        <button
          type="button"
          class="filter-btn"
          data-country="CA"
        >
          <i class="fa-solid fa-flag"></i>
          Canada
        </button>

        <button
          type="button"
          class="filter-btn"
          data-country="GB"
        >
          <i class="fa-solid fa-flag"></i>
          United Kingdom
        </button>

      </div>

    </section>


    <!-- INVENTORY STATUS -->

    <div
      id="diagnostic"
      class="inventory-status"
      aria-live="polite"
    >
      Loading inventory...
    </div>


    <!-- NUMBERS -->

    <section
      id="numbersList"
      class="numbers-list"
      aria-live="polite"
    >

      <div class="state-box">

        <div class="state-icon">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>

        <h2>
          Loading numbers
        </h2>

        <p>
          Checking available inventory.
        </p>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="number-selection.js?v=9"
  ></script>

</body>

</html>
