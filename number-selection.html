<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Select Number | Wavynum</title>

  <link
    rel="stylesheet"
    href="style.css?v=13"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="number-selection.css?v=1"
  >
</head>

<body class="wavynum-number-selection">

  <main class="number-selection-page">

    <!-- HEADER -->
    <header class="number-selection-header">

      <a
        href="buy-number.html"
        class="number-selection-back"
        aria-label="Back"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <div class="number-selection-heading">

        <span>
          NUMBER MARKETPLACE
        </span>

        <h1>
          Select a number
        </h1>

        <p>
          Choose an available number for your service.
        </p>

      </div>

    </header>


    <!-- SELECTED SERVICE -->
    <section class="selected-service-card">

      <div class="selected-service-icon">

        <img
          id="selectedServiceLogo"
          alt=""
        >

        <i
          id="selectedServiceFallback"
          class="fa-solid fa-layer-group"
        ></i>

      </div>

      <div>

        <span class="selected-service-label">
          SERVICE
        </span>

        <strong id="selectedServiceName">
          Loading...
        </strong>

      </div>

    </section>


    <!-- COUNTRY -->
    <section class="country-section">

      <div class="country-title">
        <i class="fa-solid fa-globe"></i>
        <span>Country</span>
      </div>

      <div class="country-buttons">

        <button
          type="button"
          class="country-button active"
          data-country="all"
        >
          <i class="fa-solid fa-earth-americas"></i>
          All
        </button>

        <button
          type="button"
          class="country-button"
          data-country="US"
        >
          <i class="fa-solid fa-flag-usa"></i>
          United States
        </button>

        <button
          type="button"
          class="country-button"
          data-country="CA"
        >
          <i class="fa-solid fa-flag"></i>
          Canada
        </button>

        <button
          type="button"
          class="country-button"
          data-country="GB"
        >
          <i class="fa-solid fa-flag"></i>
          United Kingdom
        </button>

      </div>

    </section>


    <!-- INVENTORY STATUS -->
    <div
      id="inventoryStatus"
      class="inventory-status"
    >
      Loading inventory...
    </div>


    <!-- NUMBERS -->
    <section
      id="numberList"
      class="number-list"
    >

      <div class="number-state">

        <div class="number-state-icon">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>

        <h2>
          Loading numbers
        </h2>

        <p>
          Checking available inventory.
        </p>

      </div>

    </section>

  </main>


  <!-- IMPORTANT:
       This page does NOT load script.js.
       It uses only number-selection.js.
  -->

  <script
    type="module"
    src="number-selection.js?v=1"
  ></script>

</body>
</html>
