<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose Number - Wavynum</title>

  <link rel="stylesheet" href="style.css?v=11">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    body {
      margin: 0;
      background: #020604;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .number-selection-main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 14px 35px;
      box-sizing: border-box;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid #174c35;
      background: #07130e;
      color: #42e89b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .page-header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
    }

    .selected-service-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #07130e;
      border: 1px solid #174c35;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .selected-service-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      object-fit: contain;
      background: #ffffff;
      padding: 5px;
      box-sizing: border-box;
    }

    .selected-service-info {
      min-width: 0;
    }

    .selected-service-label {
      font-size: 11px;
      color: #7f998d;
      margin-bottom: 3px;
    }

    .selected-service-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      border: 1px solid #174c35;
      background: #07130e;
      color: #9ab0a5;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #0c3d29;
      border-color: #22c77a;
      color: #ffffff;
    }

    .numbers-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .number-card {
      background: #07130e;
      border: 1px solid #174c35;
      border-radius: 15px;
      padding: 12px;
      box-sizing: border-box;
      min-width: 0;
    }

    .number-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .number-country {
      font-size: 11px;
      color: #87a095;
      margin-bottom: 5px;
    }

    .actual-phone-number {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      line-height: 1.25;
    }

    .available-badge {
      flex-shrink: 0;
      background: rgba(34, 199, 122, 0.12);
      border: 1px solid rgba(34, 199, 122, 0.35);
      color: #42e89b;
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .number-details {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 9px 0;
      padding-top: 9px;
      border-top: 1px solid #123324;
    }

    .detail-item {
      min-width: 0;
    }

    .detail-label {
      display: block;
      font-size: 9px;
      color: #668177;
      margin-bottom: 3px;
    }

    .detail-value {
      display: block;
      font-size: 11px;
      color: #d5e2dc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .number-price {
      color: #42e89b;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .choose-number-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: #16a765;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .choose-number-btn:hover {
      background: #1bc276;
    }

    .state-box {
      text-align: center;
      background: #07130e;
      border: 1px solid #174c35;
      border-radius: 16px;
      padding: 30px 18px;
      color: #8ea49a;
    }

    .state-box i {
      font-size: 28px;
      color: #42e89b;
      margin-bottom: 12px;
    }

    .state-box h3 {
      color: #ffffff;
      margin: 0 0 7px;
      font-size: 16px;
    }

    .state-box p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .error-box i {
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .number-selection-main {
        padding: 14px 10px 28px;
      }

      .numbers-list {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .number-card {
        padding: 11px;
      }

      .actual-phone-number {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="number-selection-main">

    <div class="page-header">
      <a href="buy-number.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <h1>Choose Number</h1>
    </div>

    <div class="selected-service-bar">
      <img
        id="serviceLogo"
        class="selected-service-logo"
        src=""
        alt="Service"
      >

      <div class="selected-service-info">
        <div class="selected-service-label">
          Numbers available for
        </div>

        <div
          id="serviceName"
          class="selected-service-name"
        >
          Loading...
        </div>
      </div>
    </div>

    <div class="filters">
      <button
        class="filter-btn active"
        data-country="all"
      >
        All
      </button>

      <button
        class="filter-btn"
        data-country="US"
      >
        🇺🇸 US
      </button>

      <button
        class="filter-btn"
        data-country="CA"
      >
        🇨🇦 Canada
      </button>

      <button
        class="filter-btn"
        data-country="GB"
      >
        🇬🇧 UK
      </button>
    </div>

    <div id="numbersContainer">

      <div class="state-box">
        <i class="fa-solid fa-spinner fa-spin"></i>

        <h3>Loading numbers...</h3>

        <p>
          Checking available numbers.
        </p>
      </div>

    </div>

  </main>

  <script type="module">

    import {
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    import {
      db
    } from "./firebase.js";


    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    let selectedService =
      urlParams.get("service");


    selectedService =
      selectedService
        ? selectedService.trim()
        : "";


    const serviceAliases = {

      "facebook": "facebook",

      "whatsapp": "whatsapp",

      "instagram": "instagram",

      "telegram": "telegram",

      "snapchat": "snapchat",

      "google voice": "google voice",

      "textplus": "textplus",

      "textnow": "textnow",

      "textfree": "textfree",

      "hushed": "hushed",

      "burner": "burner",

      "2ndline": "2ndline",

      "freetone": "freetone",

      "coverme": "coverme",

      "numero": "numero",

      "mysudo": "mysudo",

      "twitter": "twitter / x",

      "twitter / x": "twitter / x",

      "x": "twitter / x"

    };


    function normalizeService(value) {

      return String(value || "")
        .trim()
        .toLowerCase();

    }


    function getServiceKey(value) {

      const normalized =
        normalizeService(value);

      return (
        serviceAliases[normalized]
        || normalized
      );

    }


    const selectedServiceKey =
      getServiceKey(
        selectedService
      );


    const serviceLogos = {

      "facebook":
        "https://cdn.brandfetch.io/idpKX136kp/w/256/h/256/theme/dark/icon.png",

      "whatsapp":
        "https://cdn.brandfetch.io/id3S7XK9KX/w/256/h/256/theme/dark/icon.png",

      "instagram":
        "https://cdn.brandfetch.io/idM5vQyz1p/w/256/h/256/theme/dark/icon.png",

      "telegram":
        "https://cdn.brandfetch.io/idVfYdR0Ff/w/256/h/256/theme/dark/icon.png",

      "snapchat":
        "https://cdn.brandfetch.io/id4E1nQZ7y/w/256/h/256/theme/dark/icon.png",

      "google voice":
        "https://cdn.brandfetch.io/idOQ4m0N3y/w/256/h/256/theme/dark/icon.png",

      "textplus":
        "https://cdn.brandfetch.io/idR4bQvL6X/w/256/h/256/theme/dark/icon.png",

      "textnow":
        "https://cdn.brandfetch.io/id7GJ4gXq5F/w/256/h/256/theme/dark/icon.png",

      "textfree":
        "https://cdn.brandfetch.io/idbX4Q7W6h/w/256/h/256/theme/dark/icon.png",

      "hushed":
        "https://cdn.brandfetch.io/idWmYQK9sQF/w/256/h/256/theme/dark/icon.png",

      "burner":
        "https://cdn.brandfetch.io/idJ4p7vP3wQ/w/256/h/256/theme/dark/icon.png",

      "2ndline":
        "https://cdn.brandfetch.io/id5QY7Qn1Jv/w/256/h/256/theme/dark/icon.png",

      "freetone":
        "https://cdn.brandfetch.io/id7Y0qX5nK3/w/256/h/256/theme/dark/icon.png",

      "coverme":
        "https://cdn.brandfetch.io/idX6g9R4kP2/w/256/h/256/theme/dark/icon.png",

      "numero":
        "https://cdn.brandfetch.io/id0Q7pM6wX9/w/256/h/256/theme/dark/icon.png",

      "mysudo":
        "https://cdn.brandfetch.io/id9X3mY4vQ7/w/256/h/256/theme/dark/icon.png",

      "twitter / x":
        "https://cdn.brandfetch.io/idaw7xR9gF/w/256/h/256/theme/dark/icon.png"

    };


    const serviceName =
      document.getElementById(
        "serviceName"
      );


    const serviceLogo =
      document.getElementById(
        "serviceLogo"
      );


    const numbersContainer =
      document.getElementById(
        "numbersContainer"
      );


    serviceName.textContent =
      selectedService ||
      "Service";


    const logoUrl =
      serviceLogos[
        selectedServiceKey
      ];


    if (logoUrl) {

      serviceLogo.src =
        logoUrl;

    } else {

      serviceLogo.style.display =
        "none";

    }


    let allNumbers = [];

    let activeCountry = "all";


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function renderNumbers() {

      let filtered =
        allNumbers.filter(
          (item) => {

            if (
              activeCountry === "all"
            ) {

              return true;

            }

            return (
              String(
                item.country || ""
              )
              .trim()
              .toUpperCase()
              === activeCountry
            );

          }
        );


      if (!filtered.length) {

        numbersContainer.innerHTML = `

          <div class="state-box">

            <i class="fa-solid fa-phone-slash"></i>

            <h3>
              No numbers available
            </h3>

            <p>
              There are currently no available numbers for
              ${escapeHtml(selectedService || "this service")}.
            </p>

          </div>

        `;

        return;

      }


      numbersContainer.innerHTML = `

        <div class="numbers-list">

          ${filtered.map(
            (item) => `

              <div
                class="number-card"
                data-id="${escapeHtml(item.id)}"
              >

                <div class="number-top">

                  <div>

                    <div class="number-country">
                      ${escapeHtml(
                        item.countryName
                      )}
                    </div>

                    <div class="actual-phone-number">
                      ${escapeHtml(
                        item.number
                      )}
                    </div>

                  </div>

                  <span class="available-badge">
                    Available
                  </span>

                </div>


                <div class="number-details">

                  <div class="detail-item">

                    <span class="detail-label">
                      Provider
                    </span>

                    <span class="detail-value">
                      ${escapeHtml(
                        item.provider
                      )}
                    </span>

                  </div>


                  <div class="detail-item">

                    <span class="detail-label">
                      Price
                    </span>

                    <span class="number-price">
                      $${Number(
                        item.price
                      ).toFixed(2)}
                    </span>

                  </div>

                </div>


                <button
                  class="choose-number-btn"
                  data-id="${escapeHtml(item.id)}"
                >
                  Choose Number
                </button>

              </div>

            `
          ).join("")}

        </div>

      `;


      document
        .querySelectorAll(
          ".choose-number-btn"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                const id =
                  button.dataset.id;


                const selected =
                  allNumbers.find(
                    (item) =>
                      item.id === id
                  );


                if (!selected) {

                  alert(
                    "This number is no longer available."
                  );

                  return;

                }


                const selectedNumber = {

                  id:
                    selected.id,

                  service:
                    selectedService,

                  number:
                    selected.number,

                  country:
                    selected.country,

                  countryName:
                    selected.countryName,

                  price:
                    selected.price,

                  provider:
                    selected.provider

                };


                localStorage.setItem(
                  "wavynumSelectedNumber",
                  JSON.stringify(
                    selectedNumber
                  )
                );


                window.location.href =
                  "number-confirmation.html";

              }
            );

          }
        );

    }


    async function loadNumbers() {

      try {

        if (!selectedService) {

          numbersContainer.innerHTML = `

            <div class="state-box error-box">

              <i class="fa-solid fa-triangle-exclamation"></i>

              <h3>
                Service not selected
              </h3>

              <p>
                Please go back and select a service.
              </p>

            </div>

          `;

          return;

        }


        const numbersSnapshot =
          await getDocs(
            collection(
              db,
              "numbers"
            )
          );


        allNumbers = [];


        numbersSnapshot.forEach(
          (numberDoc) => {

            const data =
              numberDoc.data();


            const status =
              String(
                data.status || ""
              )
              .trim()
              .toLowerCase();


            if (
              status !== "available"
            ) {

              return;

            }


            /*
              IMPORTANT FIX:

              Firestore services should normally
              be an array, but this also supports
              a single string value.

              Example array:
              ["Facebook", "WhatsApp"]

              Example string:
              "Facebook"
            */

            const services =
              Array.isArray(
                data.services
              )
                ? data.services
                : (
                    typeof data.services === "string"
                      ? [data.services]
                      : []
                  );


            const supportsService =
              services.some(
                (service) => {

                  const serviceKey =
                    getServiceKey(
                      service
                    );


                  return (
                    serviceKey ===
                    selectedServiceKey
                  );

                }
              );


            if (
              !supportsService
            ) {

              return;

            }


            allNumbers.push({

              id:
                numberDoc.id,

              number:
                data.number || "",

              country:
                data.country || "",

              countryName:
                data.countryName ||
                "Unknown",

              price:
                Number(
                  data.price
                ) || 0,

              provider:
                data.provider ||
                "Provider"

            });

          }
        );


        renderNumbers();

      } catch (error) {

        console.error(
          "Error loading numbers:",
          error
        );


        numbersContainer.innerHTML = `

          <div class="state-box error-box">

            <i class="fa-solid fa-circle-exclamation"></i>

            <h3>
              Unable to load numbers
            </h3>

            <p>
              ${escapeHtml(
                error.message ||
                "Please try again."
              )}
            </p>

          </div>

        `;

      }

    }


    document
      .querySelectorAll(
        ".filter-btn"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter-btn"
                )
                .forEach(
                  (btn) =>
                    btn.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeCountry =
                button.dataset.country;


              renderNumbers();

            }
          );

        }
      );


    loadNumbers();

  </script>

</body>
</html>
