<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Wavynum</title>

  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      margin: 0;
      background: #050806;
      color: #f5fff7;
      font-family: Arial, sans-serif;
    }

    .support-page {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .support-header {
      height: 72px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: #080d0a;
    }

    .support-logo {
      color: #39e86f;
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #101812;
      text-decoration: none;
    }

    .support-container {
      width: min(900px, calc(100% - 28px));
      margin: 28px auto;
    }

    .support-intro {
      margin-bottom: 22px;
    }

    .eyebrow {
      color: #39e86f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .support-intro h1 {
      margin: 6px 0;
      font-size: 30px;
    }

    .support-intro p {
      margin: 0;
      color: #8e9b92;
      line-height: 1.5;
    }

    .support-card {
      background: linear-gradient(145deg,#0d1510,#080d0a);
      border: 1px solid rgba(57,232,111,.12);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .support-card h2 {
      margin: 0 0 15px;
      font-size: 18px;
    }

    .support-form {
      display: grid;
      gap: 12px;
    }

    .support-form input,
    .support-form select,
    .support-form textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.08);
      background: #050806;
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      outline: none;
    }

    .support-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .support-form input:focus,
    .support-form select:focus,
    .support-form textarea:focus {
      border-color: #39e86f;
    }

    .primary-button {
      border: 0;
      background: #39e86f;
      color: #031007;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .ticket-list {
      display: grid;
      gap: 10px;
    }

    .ticket {
      background: #080d0a;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
    }

    .ticket:hover {
      border-color: rgba(57,232,111,.35);
    }

    .ticket-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .ticket-title {
      font-weight: 800;
    }

    .ticket-message {
      margin-top: 7px;
      color: #929e95;
      font-size: 13px;
      line-height: 1.45;
    }

    .ticket-date {
      color: #657269;
      font-size: 11px;
      margin-top: 9px;
    }

    .status {
      font-size: 10px;
      font-weight: 800;
      border-radius: 20px;
      padding: 5px 9px;
      white-space: nowrap;
    }

    .status-open {
      background: rgba(57,232,111,.12);
      color: #39e86f;
    }

    .status-pending {
      background: rgba(255,190,70,.12);
      color: #ffbe46;
    }

    .status-resolved {
      background: rgba(150,160,155,.12);
      color: #a9b2ac;
    }

    .empty-state,
    .loading-state {
      text-align: center;
      padding: 30px 15px;
      color: #77837b;
    }

    /* CHAT */

    .chat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .chat-overlay.show {
      display: flex;
    }

    .chat-box {
      width: min(700px, 100%);
      height: min(720px, 94vh);
      background: #080d0a;
      border: 1px solid rgba(57,232,111,.12);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .chat-header strong {
      display: block;
    }

    .chat-header small {
      color: #768179;
    }

    .close-chat {
      border: 0;
      background: #111912;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 11px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 11px 13px;
      border-radius: 15px;
      line-height: 1.45;
      font-size: 14px;
    }

    .message.user {
      align-self: flex-end;
      background: #39e86f;
      color: #031007;
      border-bottom-right-radius: 4px;
    }

    .message.admin {
      align-self: flex-start;
      background: #141d17;
      color: #eaf4ed;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 9px;
      opacity: .6;
      margin-top: 5px;
    }

    .chat-form {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .chat-form input {
      flex: 1;
      min-width: 0;
      background: #050806;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 13px;
      outline: none;
    }

    .chat-form button {
      width: 48px;
      border: 0;
      border-radius: 12px;
      background: #39e86f;
      color: #031007;
      cursor: pointer;
    }

    .notice {
      font-size: 12px;
      color: #748078;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .support-container {
        width: calc(100% - 20px);
      }

      .support-intro h1 {
        font-size: 25px;
      }

      .chat-box {
        height: 94vh;
      }
    }
  </style>
</head>

<body class="support-page">

<header class="support-header">
  <a href="dashboard.html" class="support-logo">Wavynum</a>

  <a href="dashboard.html" class="back-button">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
</header>

<main class="support-container">

  <section class="support-intro">
    <div class="eyebrow">CUSTOMER SUPPORT</div>
    <h1>How can we help?</h1>
    <p>
      Create a support request and our support team can respond directly in your account.
    </p>
  </section>

  <section class="support-card">
    <h2>Start a conversation</h2>

    <form id="supportForm" class="support-form">

      <select id="category" required>
        <option value="">Select a category</option>
        <option value="Account">Account</option>
        <option value="Number purchase">Number purchase</option>
        <option value="Payment">Payment</option>
        <option value="SMS">SMS / Inbox</option>
        <option value="Technical">Technical issue</option>
        <option value="Other">Other</option>
      </select>

      <input
        id="subject"
        type="text"
        maxlength="100"
        placeholder="Subject"
        required
      >

      <textarea
        id="message"
        maxlength="2000"
        placeholder="Describe your issue..."
        required
      ></textarea>

      <button id="submitButton" class="primary-button" type="submit">
        Send support request
      </button>

    </form>

    <div class="notice">
      Your conversation is linked to your Wavynum account.
    </div>
  </section>

  <section class="support-card">
    <h2>Your conversations</h2>
    <div id="ticketList" class="ticket-list">
      <div class="loading-state">Loading conversations...</div>
    </div>
  </section>

</main>

<!-- CHAT -->

<div id="chatOverlay" class="chat-overlay">

  <div class="chat-box">

    <div class="chat-header">
      <div>
        <strong id="chatSubject">Support</strong>
        <small id="chatStatus">Open</small>
      </div>

      <button id="closeChat" class="close-chat">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="messages" class="messages"></div>

    <form id="chatForm" class="chat-form">

      <input
        id="replyInput"
        type="text"
        maxlength="2000"
        placeholder="Write a message..."
        autocomplete="off"
        required
      >

      <button type="submit">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </form>

  </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  query,
  where,
  orderBy,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const supportForm = document.getElementById("supportForm");
const submitButton = document.getElementById("submitButton");
const ticketList = document.getElementById("ticketList");

const chatOverlay = document.getElementById("chatOverlay");
const closeChat = document.getElementById("closeChat");
const chatSubject = document.getElementById("chatSubject");
const chatStatus = document.getElementById("chatStatus");
const messages = document.getElementById("messages");
const chatForm = document.getElementById("chatForm");
const replyInput = document.getElementById("replyInput");

let currentUser = null;
let currentTicketId = null;
let unsubscribeMessages = null;


/* AUTH */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  await loadTickets();
});


/* CREATE TICKET */

supportForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (!currentUser) return;

  const category = document.getElementById("category").value;
  const subject = document.getElementById("subject").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!category || !subject || !message) return;

  submitButton.disabled = true;
  submitButton.textContent = "Sending...";

  try {

    const ticketRef = await addDoc(
      collection(db, "supportTickets"),
      {
        userId: currentUser.uid,
        userEmail: currentUser.email || "",
        category,
        subject,
        status: "open",
        lastMessage: message,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }
    );

    await addDoc(
      collection(db, "supportTickets", ticketRef.id, "messages"),
      {
        senderId: currentUser.uid,
        senderRole: "user",
        message,
        createdAt: serverTimestamp()
      }
    );

    supportForm.reset();

    await loadTickets();

    openTicket(ticketRef.id);

  } catch (error) {

    console.error(error);
    alert("Could not create your support request.");

  } finally {

    submitButton.disabled = false;
    submitButton.textContent = "Send support request";
  }

});


/* LOAD USER TICKETS */

async function loadTickets() {

  if (!currentUser) return;

  ticketList.innerHTML =
    `<div class="loading-state">Loading conversations...</div>`;

  try {

    const ticketsQuery = query(
      collection(db, "supportTickets"),
      where("userId", "==", currentUser.uid)
    );

    const snapshot = await getDocs(ticketsQuery);

    const tickets = [];

    snapshot.forEach((item) => {
      tickets.push({
        id: item.id,
        ...item.data()
      });
    });

    tickets.sort((a, b) => {

      const aTime = a.updatedAt?.toMillis?.() || 0;
      const bTime = b.updatedAt?.toMillis?.() || 0;

      return bTime - aTime;
    });

    if (!tickets.length) {

      ticketList.innerHTML = `
        <div class="empty-state">
          <i class="fa-regular fa-comments"></i>
          <p>You don't have any support conversations yet.</p>
        </div>
      `;

      return;
    }

    ticketList.innerHTML = "";

    tickets.forEach(ticket => {

      const item = document.createElement("div");
      item.className = "ticket";

      const status = ticket.status || "open";

      item.innerHTML = `
        <div class="ticket-top">

          <div class="ticket-title">
            ${escapeHtml(ticket.subject || "Support request")}
          </div>

          <span class="status status-${status}">
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="ticket-message">
          ${escapeHtml(ticket.lastMessage || "")}
        </div>

        <div class="ticket-date">
          ${formatDate(ticket.updatedAt)}
        </div>
      `;

      item.addEventListener("click", () => {
        openTicket(ticket.id);
      });

      ticketList.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    ticketList.innerHTML = `
      <div class="empty-state">
        Unable to load support conversations.
      </div>
    `;
  }
}


/* OPEN CHAT */

async function openTicket(ticketId) {

  currentTicketId = ticketId;

  const ticketSnap = await getDoc(
    doc(db, "supportTickets", ticketId)
  );

  if (!ticketSnap.exists()) return;

  const ticket = ticketSnap.data();

  if (ticket.userId !== currentUser.uid) return;

  chatSubject.textContent = ticket.subject || "Support";
  chatStatus.textContent =
    (ticket.status || "open").toUpperCase();

  chatOverlay.classList.add("show");

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  const messagesQuery = query(
    collection(db, "supportTickets", ticketId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(
    messagesQuery,
    (snapshot) => {

      messages.innerHTML = "";

      snapshot.forEach(item => {

        const data = item.data();

        const bubble = document.createElement("div");

        bubble.className =
          "message " +
          (data.senderRole === "admin" ? "admin" : "user");

        bubble.innerHTML = `
          ${escapeHtml(data.message || "")}
          <span class="message-time">
            ${formatDate(data.createdAt)}
          </span>
        `;

        messages.appendChild(bubble);
      });

      messages.scrollTop = messages.scrollHeight;
    }
  );
}


/* SEND USER MESSAGE */

chatForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (!currentUser || !currentTicketId) return;

  const text = replyInput.value.trim();

  if (!text) return;

  replyInput.disabled = true;

  try {

    await addDoc(
      collection(
        db,
        "supportTickets",
        currentTicketId,
        "messages"
      ),
      {
        senderId: currentUser.uid,
        senderRole: "user",
        message: text,
        createdAt: serverTimestamp()
      }
    );

    await updateTicket(
      currentTicketId,
      text,
      "open"
    );

    replyInput.value = "";

  } catch (error) {

    console.error(error);
    alert("Could not send message.");

  } finally {

    replyInput.disabled = false;
    replyInput.focus();
  }

});


async function updateTicket(ticketId, lastMessage, status) {

  const { updateDoc } =
    await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");

  await updateDoc(
    doc(db, "supportTickets", ticketId),
    {
      lastMessage,
      status,
      updatedAt: serverTimestamp()
    }
  );
}


/* CLOSE */

closeChat.addEventListener("click", () => {

  chatOverlay.classList.remove("show");

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  currentTicketId = null;
});


/* HELPERS */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(timestamp) {

  if (!timestamp?.toDate) {
    return "Just now";
  }

  return timestamp.toDate().toLocaleString();
}

</script>

</body>
</html>
